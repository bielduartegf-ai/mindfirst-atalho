<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MindFirst</title>
<meta name="apple-mobile-web-app-title" content="MindFirst">
<meta name="application-name" content="MindFirst">
<meta name="theme-color" content="#06070a">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<script>
  // Aberto pelo ícone da tela de início (endereço com ?abrir=1): vai direto para o app.
  if (/[?&]abrir=1/.test(location.search)) location.replace("https://claude.ai/artifact/56i8Zjv5FT4e2NUkicp61W");
</script>
<style>
  html,body{margin:0;min-height:100%;background:#06070a;color:#e8eef6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  main{min-height:100vh;display:grid;place-items:center;text-align:center;padding:28px 20px;box-sizing:border-box}
  img{width:120px;height:120px;border-radius:28px;box-shadow:0 0 40px rgba(255,45,85,.45)}
  h1{font-size:24px;margin:22px 0 8px}
  p{color:#a9b3c2;font-size:15px;line-height:1.55;margin:0 auto 22px;max-width:340px}
  ol{text-align:left;max-width:320px;margin:0 auto 26px;padding-left:22px;color:#c2cad6;font-size:15px;line-height:1.7}
  b{color:#fff}
  a{display:inline-block;padding:14px 22px;border-radius:14px;background:linear-gradient(135deg,#a3123a,#ff2d55);color:#fff;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<main>
  <div>
    <img src="/icon-512.png" alt="Ícone do MindFirst">
    <h1>MindFirst na tela de início</h1>
    <p>Para ter o ícone no iPhone:</p>
    <ol>
      <li>Toque em <b>Compartilhar</b> (o quadrado com a seta, embaixo do Safari).</li>
      <li>Escolha <b>Adicionar à Tela de Início</b>.</li>
      <li>Toque em <b>Adicionar</b>.</li>
    </ol>
    <p>Depois é só abrir pelo ícone: ele leva direto para o seu MindFirst.</p>
    <a href="https://claude.ai/artifact/56i8Zjv5FT4e2NUkicp61W">Abrir o MindFirst agora</a>
  </div>
</main>
<script>
  // Deixa o endereço com ?abrir=1, que é o que o iPhone salva no ícone.
  try { history.replaceState(null, "", location.pathname + "?abrir=1"); } catch (e) {}
</script>
</body>
</html>
