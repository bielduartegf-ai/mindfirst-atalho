<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MindFirst</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MindFirst">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#06070a">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Rajdhani:wght@500;600;700&display=swap">
<style>
/* Layout: HUD de cockpit. Celular: coluna única com barra inferior. Desktop: trilho lateral + grade de 12 colunas, com respiro generoso entre painéis. */
:root{
  --bg:#06070a; --panel:rgba(13,16,22,.8); --panel-solid:#0b0e13; --sheet:#0c0f15;
  --line:rgba(140,220,255,.10); --line2:rgba(140,220,255,.22); --grid:rgba(63,240,255,.035);
  --text:#e8eef6; --text2:#c2cad6; --muted:#8792a3; --dim:#596272;
  --hud:#3ff0ff; --vio:#a46bff; --brand:#ff2d55; --brand2:#a3123a;
  --ent:#2bff9a; --sai:#ff3d63; --warn:#ffc53d;
  --f-display:Rajdhani,"Arial Narrow",system-ui,sans-serif;
  --f-body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --gap:20px; --pad:22px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;font-family:var(--f-body);font-size:15px;line-height:1.5;color:var(--text);
  background:radial-gradient(900px 520px at 88% -8%,rgba(255,45,85,.12),transparent 62%),radial-gradient(700px 480px at -5% 8%,rgba(63,240,255,.07),transparent 60%),var(--bg);
  background-attachment:fixed;min-height:100vh;padding-bottom:calc(86px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:44px 44px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000,transparent 72%);mask-image:radial-gradient(ellipse at 50% 0%,#000,transparent 72%)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--hud);outline-offset:2px}

/* Cabeçalho */
header.top{position:relative;z-index:2;display:flex;align-items:center;gap:14px;max-width:1240px;margin:0 auto;padding-block:18px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo-wrap{position:relative;flex:none;width:50px;height:50px}
.logo-wrap img{width:50px;height:50px;object-fit:cover;border-radius:12px;display:block}
.logo-wrap::before{content:"";position:absolute;inset:-4px;border-radius:15px;border:1px solid var(--line2)}
.brand{flex:1;min-width:0}
.brand-t{font:700 24px/1 var(--f-display);letter-spacing:.22em}
.status{display:flex;flex-wrap:wrap;align-items:center;gap:2px 12px;margin-top:6px;font:500 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:var(--ent);box-shadow:0 0 8px var(--ent);vertical-align:1px}
.dot.local{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.tools{display:flex;gap:8px;flex:none;align-items:center}
.eye{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.02);color:var(--muted);font:500 12px var(--f-body);cursor:pointer;transition:color .2s,border-color .2s}
.eye:hover{color:var(--text);border-color:var(--line2)}
.eye.off{color:var(--warn);border-color:rgba(255,197,61,.35)}
.eye svg{width:16px;height:16px;flex:none}
.bell{position:relative;width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line2);background:rgba(63,240,255,.05);color:var(--text);cursor:pointer;transition:border-color .2s,background .2s}
.bell:hover{border-color:var(--hud);background:rgba(63,240,255,.1)}
.bell svg{width:19px;height:19px}
.badge{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--brand);color:#fff;font:600 10.5px/19px var(--f-mono);text-align:center;box-shadow:0 0 12px rgba(255,45,85,.7)}
.bell.shake{animation:shake .7s ease}
@media(max-width:560px){.eye span{display:none}.eye{width:38px;padding:0;justify-content:center}.brand-t{font-size:21px;letter-spacing:.18em}}

/* Navegação */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;background:rgba(7,8,11,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:7px max(8px,env(safe-area-inset-right,0px)) calc(7px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.bottom button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;color:var(--dim);font:500 11px var(--f-body);padding:7px 4px;cursor:pointer;border-radius:10px;transition:color .2s}
nav.bottom button svg{width:22px;height:22px}
nav.bottom button:hover{color:var(--text2)}
nav.bottom button.on{color:var(--text)}
nav.bottom button.on svg{color:var(--hud);filter:drop-shadow(0 0 6px rgba(63,240,255,.55))}
nav.bottom button.on::before{content:"";position:absolute;top:-8px;left:32%;right:32%;height:2px;border-radius:2px;background:var(--hud);box-shadow:0 0 8px var(--hud)}

/* Grade principal */
main{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr);align-items:start;gap:var(--gap);width:100%;max-width:1240px;margin:0 auto;padding-block:18px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main>*{min-width:0}
main.entra>*{animation:up .45s ease both}
main.entra>*:nth-child(2){animation-delay:.05s} main.entra>*:nth-child(3){animation-delay:.1s} main.entra>*:nth-child(4){animation-delay:.15s} main.entra>*:nth-child(5){animation-delay:.2s} main.entra>*:nth-child(n+6){animation-delay:.25s}

.panel{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:var(--pad);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:border-color .25s}
.panel:hover{border-color:var(--line2)}
.hudc::before,.hudc::after{content:"";position:absolute;width:16px;height:16px;pointer-events:none;border-color:var(--hud);border-style:solid;opacity:.75}
.hudc::before{top:-1px;left:-1px;border-width:1px 0 0 1px;border-top-left-radius:18px}
.hudc::after{bottom:-1px;right:-1px;border-width:0 1px 1px 0;border-bottom-right-radius:18px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap;margin-bottom:20px}
.ph h2{margin:0;font:500 11.5px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.link{background:none;border:0;padding:4px 0;color:var(--hud);font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.link:hover{text-decoration:underline;text-underline-offset:3px}
.note{font-size:13px;color:var(--muted);margin:10px 0 0}
.empty{border:1px dashed var(--line2);border-radius:14px;padding:26px 16px;text-align:center;color:var(--muted);font-size:14px;line-height:1.6}
.pos{color:var(--ent)} .neg{color:var(--sai)} .wrn{color:var(--warn)}
.hint{font:500 10.5px var(--f-mono);letter-spacing:.06em;color:var(--dim);margin:12px 0 0;text-align:right}

/* Hero do início */
.hero{padding:30px 28px 28px;background:linear-gradient(135deg,rgba(255,45,85,.10),rgba(63,240,255,.04) 55%,transparent),var(--panel)}
.kick{font:500 11px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--hud)}
.hero h1,.hello h1{margin:14px 0 14px;font:700 clamp(32px,6vw,48px)/1.02 var(--f-display);letter-spacing:.01em;text-wrap:balance}
.brief{margin:0;max-width:68ch;color:var(--text2);font-size:15.5px;line-height:1.75}
.brief b{color:var(--text);font-weight:600}
.quote{display:flex;align-items:center;gap:12px;margin-top:22px;font-size:13px;color:var(--muted);font-style:italic}
.quote::before{content:"";width:32px;height:1px;flex:none;background:linear-gradient(90deg,var(--hud),transparent)}
.hello{padding:10px 4px 4px}

/* Faixa de alerta */
.banner{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:16px;border:1px solid rgba(255,197,61,.35);background:rgba(255,197,61,.07)}
.banner.crit{border-color:rgba(255,61,99,.4);background:rgba(255,61,99,.08)}
.banner .ic{width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:50%;background:rgba(255,197,61,.14);color:var(--warn)}
.banner.crit .ic{background:rgba(255,61,99,.14);color:var(--sai)}
.banner .ic svg{width:18px;height:18px}
.banner .tx{flex:1;min-width:0}
.banner .tx b{display:block;font-weight:600}
.banner .tx span{font-size:13px;color:var(--text2)}
.banner .bt{display:flex;gap:6px;flex:none}
.mini-btn{height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--line2);background:rgba(255,255,255,.03);color:var(--text);font:500 12px var(--f-body);cursor:pointer}
.mini-btn:hover{border-color:var(--hud)}
.mini-btn.x{width:34px;padding:0;color:var(--muted);font-size:16px}

/* Reator e roscas */
.reactor-card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center}
@media(max-width:640px){.reactor-card{grid-template-columns:minmax(0,1fr);justify-items:center;gap:20px}}
.dn{position:relative;margin:0 auto;max-width:100%;aspect-ratio:1}
.dn svg{display:block;width:100%;height:100%;overflow:visible}
.reactor{width:240px}
.donut{width:210px}
.ticks{transform-origin:120px 120px;animation:spin 140s linear infinite}
.dc{position:absolute;inset:22%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.dc-lbl{font:500 10px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dc-main{font:700 27px/1.1 var(--f-display);white-space:nowrap;margin-top:4px;font-variant-numeric:tabular-nums}
.donut .dc-main{font-size:24px}
.dc-sub{font:500 11px var(--f-mono);color:var(--muted);margin-top:4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg-arc{cursor:pointer;transition:transform .22s ease,opacity .22s ease;transform-box:view-box;transform-origin:center}
.seg-arc.hi{transform:scale(1.05)}
.dn.has-hi .seg-arc:not(.hi){opacity:.35}
.stats{width:100%;min-width:0}
.stat{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.stat:first-child{border-top:0;padding-top:0}
.stat .sl{font-size:13px;color:var(--muted)}
.stat .v{font:700 22px var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}

/* Botões de lançamento */
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
.act{height:54px;border-radius:14px;border:1px solid;cursor:pointer;font:700 16px var(--f-display);letter-spacing:.12em;text-transform:uppercase;transition:filter .2s,transform .12s,box-shadow .25s}
.act:hover{filter:brightness(1.12)} .act:active{transform:scale(.97)}
.act.ent{background:rgba(43,255,154,.10);border-color:rgba(43,255,154,.45);color:var(--ent)}
.act.ent:hover{box-shadow:0 0 24px rgba(43,255,154,.25)}
.act.sai{background:linear-gradient(135deg,var(--brand2),var(--brand));border-color:transparent;color:#fff}
.act.sai:hover{box-shadow:0 0 24px rgba(255,45,85,.35)}

/* Listas */
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.row:first-child,.day+.row{border-top:0}
.row.click{cursor:pointer;margin:0 -10px;padding-left:10px;padding-right:10px;border-radius:10px;transition:background .2s}
.row.click:hover{background:rgba(63,240,255,.05)}
.rt{min-width:0}
.rt .n{overflow-wrap:anywhere}
.tag{font-size:12px;color:var(--muted);margin-top:3px}
.rr{display:flex;align-items:center;gap:12px;flex:none}
.amt{font:600 17px var(--f-display);letter-spacing:.02em;white-space:nowrap;font-variant-numeric:tabular-nums}
.x{width:30px;height:30px;flex:none;border-radius:8px;border:1px solid var(--line);background:none;color:var(--dim);cursor:pointer;font-size:16px;line-height:1;transition:color .2s,border-color .2s}
.x:hover{color:var(--sai);border-color:var(--sai)}
.day{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:22px 0 8px;font:500 10.5px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--hud);border-bottom:1px solid var(--line)}
.day:first-child{padding-top:0}
.day.warn{color:var(--warn)}
.rk{display:block;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:10px;margin:0 -10px;width:calc(100% + 20px);border-radius:10px;cursor:pointer;transition:background .2s}
.rk:hover,.rk.on{background:rgba(63,240,255,.06)}
.rk-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px}
.rk-top>span:first-child{min-width:0;overflow-wrap:anywhere;display:flex;align-items:center;gap:8px}
.rk-top>span:last-child{white-space:nowrap;color:var(--text2);font-variant-numeric:tabular-nums}
.sw-c{width:9px;height:9px;border-radius:3px;flex:none}
.lim{font:500 10.5px var(--f-mono);color:var(--muted);margin-top:6px;display:flex;justify-content:space-between;gap:8px}
.meter{height:6px;border-radius:6px;background:rgba(255,255,255,.06);overflow:hidden;margin-top:18px}
.meter.thin{height:5px;margin-top:8px}
.meter>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--hud),#5aa9ff);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.meter>i.warn{background:var(--warn)} .meter>i.over{background:var(--sai)}
.lim-edit{display:flex;gap:8px;margin:4px 0 10px}
.lim-edit input{height:40px;padding:0 12px;font-size:15px}
.lim-edit .mini-btn{height:40px;flex:none}

/* Agenda */
.chk{display:flex;gap:14px;align-items:flex-start;flex:1;min-width:0;cursor:pointer}
.chk input{appearance:none;-webkit-appearance:none;flex:none;width:22px;height:22px;margin:0;padding:0;border:1.5px solid var(--line2);border-radius:7px;background:none;display:grid;place-content:center;cursor:pointer;transition:background .2s,border-color .2s,transform .15s}
.chk input:hover{border-color:var(--hud)}
.chk input:active{transform:scale(.88)}
.chk input:checked{background:var(--hud);border-color:var(--hud)}
.chk input:checked::after{content:"";width:10px;height:5px;border-left:2px solid var(--bg);border-bottom:2px solid var(--bg);transform:rotate(-45deg) translate(1px,-1px)}
.chk>span{min-width:0;overflow-wrap:anywhere}
.chk .tag{display:block}
.tipo{display:inline-block;margin-right:8px;padding:2px 7px;border-radius:5px;font:500 10px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--hud);background:rgba(63,240,255,.07);border:1px solid rgba(63,240,255,.22);vertical-align:1px}
.cd{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:999px;font:600 10px var(--f-mono);letter-spacing:.04em;color:var(--warn);background:rgba(255,197,61,.1);border:1px solid rgba(255,197,61,.3)}
.cd.agora{color:var(--sai);background:rgba(255,61,99,.1);border-color:rgba(255,61,99,.35)}
.done{color:var(--muted);text-decoration:line-through}

/* Finanças */
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.stepper{display:inline-flex;align-items:center;gap:2px;padding:4px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.stepper button{width:38px;height:38px;border:0;border-radius:10px;background:none;color:var(--text);font-size:20px;cursor:pointer}
.stepper button:hover{background:rgba(63,240,255,.08)}
.stepper span{min-width:160px;text-align:center;font:600 16px var(--f-display);letter-spacing:.08em;text-transform:uppercase}
.seg{display:inline-flex;flex-wrap:wrap;gap:3px;padding:4px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.02)}
.seg button{border:0;background:none;color:var(--muted);font:500 12px var(--f-body);padding:7px 13px;border-radius:999px;cursor:pointer;transition:color .2s,background .2s}
.seg button:hover{color:var(--text)}
.seg button.on{background:rgba(63,240,255,.12);color:var(--text);box-shadow:inset 0 0 0 1px rgba(63,240,255,.35)}
.kstrip{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr}
.k{min-width:0;padding:2px 20px;border-left:1px solid var(--line)}
.k:first-child{border-left:0;padding-left:0}
.k .l{font:500 10.5px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.k .v{font:700 25px/1.15 var(--f-display);margin-top:8px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.k.big .v{font-size:38px}
.k .s{font-size:12px;color:var(--muted);margin-top:4px}
@media(max-width:700px){.kstrip{grid-template-columns:1fr 1fr;row-gap:22px}.k.big{grid-column:1/-1}.k:nth-child(2){border-left:0;padding-left:0}.k:nth-child(4){padding-right:0}}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font:500 11px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.lg{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.lg.ent{background:var(--ent)} .lg.sai{background:var(--sai)} .lg.bar{background:rgba(255,61,99,.35)}
.fchips{display:flex;flex-wrap:wrap;gap:8px;margin:-6px 0 14px}
.fchip{display:inline-flex;align-items:center;gap:8px;padding:5px 6px 5px 12px;border-radius:999px;background:rgba(63,240,255,.1);border:1px solid rgba(63,240,255,.35);font-size:12.5px}
.fchip button{width:22px;height:22px;border-radius:50%;border:0;background:rgba(255,255,255,.08);color:var(--text);cursor:pointer;line-height:1}

/* Gráficos */
.chart svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.gl{stroke:rgba(63,240,255,.08);stroke-width:1}
.ax{fill:var(--dim);font:500 10px var(--f-mono)}
.mx{fill:var(--muted);font:500 11px var(--f-mono);text-transform:uppercase}
.hit{fill:transparent;cursor:pointer}
.cross{stroke:rgba(63,240,255,.55);stroke-width:1;stroke-dasharray:3 3;opacity:0;transition:opacity .15s}
.cross.on,.hdot.on{opacity:1}
.hdot{fill:var(--bg);stroke-width:2.5;opacity:0;transition:opacity .15s}
.l-sai{fill:none;stroke:var(--sai);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.l-ent{fill:none;stroke:var(--ent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;opacity:.9}
.dbar{fill:var(--sai);opacity:.22;transition:opacity .15s}
.dbar.hi{opacity:.8}
.b-ent{fill:var(--ent)} .b-sai{fill:var(--sai)} .b-pos{fill:var(--ent)} .b-neg{fill:var(--sai)}
.mg rect{opacity:.42;transition:opacity .2s} .mg.sel rect,.mg.hov rect{opacity:.95} .mg.sel .mx{fill:var(--hud)}
.mg.hov .mx{fill:var(--text)}
.mg .hl-col{fill:rgba(63,240,255,.06);opacity:0;transition:opacity .15s} .mg .hl-col.on{opacity:1}
main.entra .grow{animation:grow .8s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:50% 100%}
main.entra .draw{stroke-dasharray:1;animation:drawl 1.2s ease both}
main.entra .fadein{animation:fade 1s .3s ease both}
#tip{position:fixed;z-index:90;left:0;top:0;pointer-events:none;min-width:170px;max-width:270px;padding:11px 13px;border-radius:12px;background:rgba(12,15,21,.97);border:1px solid var(--line2);box-shadow:0 12px 32px rgba(0,0,0,.55);font-size:12.5px;line-height:1.55;opacity:0;transition:opacity .12s}
#tip.on{opacity:1}
#tip .tt{font:500 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--hud);margin-bottom:5px}
#tip .tr{display:flex;justify-content:space-between;gap:16px}
#tip .tr span{color:var(--muted)}
#tip .tr b{font-weight:600;font-variant-numeric:tabular-nums}
#tip .th{margin-top:6px;font:500 10px var(--f-mono);color:var(--dim)}

/* Métricas */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.kpi{background:var(--panel-solid);padding:15px 16px;min-width:0}
.kpi .l{font:500 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font:700 22px/1.15 var(--f-display);margin-top:7px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .s{font-size:11.5px;color:var(--muted);margin-top:3px}
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{text-align:right;padding:11px 9px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{color:var(--hud);font:500 10px var(--f-mono);letter-spacing:.1em;text-transform:uppercase}
details.more summary{cursor:pointer;color:var(--hud);font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;list-style:none;padding:4px 0}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{margin-bottom:10px}

/* Formulários */
.form{display:grid;gap:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:520px){.g3{grid-template-columns:1fr 1fr}}
input,select{width:100%;min-width:0;margin:0;padding:12px 14px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--text);font:400 16px var(--f-body);transition:border-color .2s,box-shadow .2s}
input::placeholder{color:var(--dim)}
input:focus,select:focus{outline:none;border-color:var(--hud);box-shadow:0 0 0 3px rgba(63,240,255,.12)}
select option{background:var(--panel-solid);color:var(--text)}
.btn{width:100%;height:50px;border:0;border-radius:13px;background:linear-gradient(135deg,var(--brand2),var(--brand));color:#fff;font:700 15px var(--f-display);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:filter .2s,transform .12s}
.btn:hover{filter:brightness(1.12)} .btn:active{transform:scale(.98)}
.btn.sec{background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--text)}

/* Painel de lançamento */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(3,4,6,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fade .2s ease both}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;display:grid;gap:12px;max-width:560px;max-height:calc(100dvh - 24px);overflow-y:auto;margin:0 auto;background:var(--sheet);border:1px solid var(--line2);border-bottom:0;border-radius:22px 22px 0 0;box-shadow:0 -20px 60px rgba(0,0,0,.5);animation:up .25s ease both;
  padding:14px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line2);margin:0 auto 4px}
.seg-big{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg-big button{height:46px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--muted);font:600 14px var(--f-body);cursor:pointer}
.seg-big button.on.entrada{background:rgba(43,255,154,.13);border-color:var(--ent);color:var(--ent)}
.seg-big button.on.saida{background:rgba(255,61,99,.13);border-color:var(--sai);color:var(--sai)}
.valor{height:76px;text-align:center;font:700 42px var(--f-display);letter-spacing:.04em}
.err-t{color:var(--warn)}

/* Central de alertas */
.drawer{position:fixed;z-index:51;top:0;right:0;bottom:0;width:min(430px,100vw);display:grid;align-content:start;gap:22px;overflow-y:auto;background:var(--sheet);border-left:1px solid var(--line2);box-shadow:-20px 0 60px rgba(0,0,0,.5);animation:slide .28s ease both;
  padding:calc(22px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) 22px}
.dr-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dr-h h2{margin:6px 0 0;font:700 26px var(--f-display);letter-spacing:.04em}
.al{display:grid;grid-template-columns:4px minmax(0,1fr);gap:14px;padding:14px 12px 14px 0;border-top:1px solid var(--line);cursor:pointer;border-radius:10px;transition:background .2s}
.al:hover{background:rgba(63,240,255,.04)}
.al:first-child{border-top:0}
.al .bar{border-radius:4px;background:var(--hud)}
.al.crit .bar{background:var(--sai)} .al.warn .bar{background:var(--warn)}
.al .t{font-weight:600;overflow-wrap:anywhere}
.al .d{font-size:13px;color:var(--text2);margin-top:3px;overflow-wrap:anywhere}
.al .w{font:500 10px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.al.visto{opacity:.5}
.cfg{display:grid;gap:14px;padding:18px;border:1px solid var(--line);border-radius:14px}
.cfg-r{display:flex;align-items:center;justify-content:space-between;gap:14px;font-size:14px}
.cfg-r select{width:auto;padding:8px 10px;font-size:14px}
.sw{position:relative;width:44px;height:26px;flex:none;border-radius:13px;background:rgba(255,255,255,.08);border:1px solid var(--line2);cursor:pointer;transition:background .2s,border-color .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.sw[aria-checked="true"]{background:rgba(63,240,255,.22);border-color:var(--hud)}
.sw[aria-checked="true"]::after{transform:translateX(18px);background:var(--hud)}

/* Confirmação e avisos */
#confirma{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 40%,rgba(6,7,10,.7),rgba(3,4,6,.92));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .25s ease both}
.cf{position:relative;z-index:2;width:min(92vw,410px);display:grid;gap:6px;text-align:center;background:var(--sheet);border:1px solid var(--line2);border-radius:24px;padding:30px 24px 24px;animation:pop .45s cubic-bezier(.2,1.3,.4,1) both;box-shadow:0 0 60px var(--glow)}
.orb{position:relative;width:110px;height:110px;margin:0 auto 10px}
.orb i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--c);opacity:0;animation:ripple 1.6s ease-out 3}
.orb i:nth-child(2){animation-delay:.4s} .orb i:nth-child(3){animation-delay:.8s}
.orb svg{position:relative;width:110px;height:110px}
.cf-ring{stroke-dasharray:290;animation:draw .7s ease both}
.cf-ok{stroke-dasharray:70;animation:draw2 .45s .45s ease both}
.cf-t{font:500 11.5px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.cf-v{font:700 50px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.cf-d{color:var(--text2);font-size:14.5px;line-height:1.55}
.cf-imp{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:14px;padding:13px 16px;border-radius:13px;background:rgba(63,240,255,.05);border:1px solid var(--line);text-align:left}
.cf-imp span{font:500 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.cf-imp b{font:700 20px var(--f-display);font-variant-numeric:tabular-nums}
.cf-warn{display:flex;gap:10px;align-items:flex-start;margin-top:8px;padding:12px 14px;border-radius:13px;text-align:left;font-size:13.5px;color:var(--warn);background:rgba(255,197,61,.08);border:1px solid rgba(255,197,61,.3)}
.cf-warn svg{width:18px;height:18px;flex:none;margin-top:1px}
.fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:65}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;display:flex;align-items:center;gap:14px;width:max-content;max-width:calc(100vw - 32px);padding:12px 14px 12px 14px;background:#10141b;border:1px solid var(--line2);border-radius:14px;color:var(--text);font-size:14px;box-shadow:0 12px 30px rgba(0,0,0,.5);animation:toastIn .3s cubic-bezier(.2,1.2,.4,1) both}
.toast .ti{width:26px;height:26px;flex:none;display:grid;place-items:center;border-radius:50%;background:rgba(63,240,255,.12);color:var(--hud)}
.toast .ti.ok{background:rgba(43,255,154,.14);color:var(--ent)}
.toast .ti.al{background:rgba(255,197,61,.14);color:var(--warn)}
.toast .ti svg{width:15px;height:15px}
.toast .tm{min-width:0;overflow-wrap:anywhere}
.toast button{background:none;border:0;color:var(--hud);font:600 11.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;padding:4px 0;flex:none}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
@keyframes slide{from{opacity:0;transform:translateX(40px)}}
@keyframes pop{from{opacity:0;transform:scale(.85)}}
@keyframes ripple{0%{opacity:.8;transform:scale(.7)}100%{opacity:0;transform:scale(1.7)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,14px) scale(.96)}}
@keyframes draw{from{stroke-dashoffset:290}}
@keyframes draw2{from{stroke-dashoffset:70}}
@keyframes drawl{from{stroke-dashoffset:1}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes shake{15%{transform:rotate(-16deg)}30%{transform:rotate(14deg)}45%{transform:rotate(-10deg)}60%{transform:rotate(7deg)}75%{transform:rotate(-3deg)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ===== Camada LED / neon ===== */
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
body::before{content:"";position:fixed;z-index:0;pointer-events:none;width:46vmax;height:46vmax;left:-12vmax;top:30vh;border-radius:50%;background:radial-gradient(circle,rgba(164,107,255,.16),transparent 65%);filter:blur(10px);animation:orb 22s ease-in-out infinite alternate}
@keyframes orb{to{transform:translate(70vw,-30vh) scale(1.2)}}
.glow{background:radial-gradient(120% 70% at 50% -10%,rgba(63,240,255,.10),transparent 60%),linear-gradient(rgba(63,240,255,.04) 1px,transparent 1px) 0 0/100% 28px,linear-gradient(90deg,rgba(63,240,255,.04) 1px,transparent 1px) 0 0/28px 100%,var(--panel);box-shadow:0 0 70px -30px rgba(63,240,255,.5),inset 0 0 60px rgba(0,0,0,.45)}
.hero.glow{background:radial-gradient(90% 120% at 100% 0%,rgba(255,45,85,.22),transparent 55%),radial-gradient(80% 120% at 0% 100%,rgba(164,107,255,.16),transparent 60%),linear-gradient(rgba(63,240,255,.04) 1px,transparent 1px) 0 0/100% 28px,linear-gradient(90deg,rgba(63,240,255,.04) 1px,transparent 1px) 0 0/28px 100%,var(--panel)}
.ledb{position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;pointer-events:none;background:conic-gradient(from var(--ang),transparent 0 55%,var(--hud) 68%,var(--vio) 78%,var(--brand) 88%,transparent 97%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:ang 7s linear infinite;opacity:.9}
@keyframes ang{to{--ang:360deg}}
.fxl{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none;z-index:0}
.fxl::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px)}
.scan{position:absolute;left:0;right:0;top:-140px;height:140px;background:linear-gradient(180deg,transparent,rgba(63,240,255,.09),transparent);animation:scan 7s linear infinite}
@keyframes scan{to{top:110%}}
.panel>*:not(.ledb):not(.fxl){position:relative;z-index:1}
.live{display:inline-flex;align-items:center;gap:7px;font:600 10px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ent)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ent);box-shadow:0 0 10px var(--ent),0 0 20px var(--ent);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.kick{text-shadow:0 0 12px rgba(63,240,255,.6)}
.brand-t{background:linear-gradient(110deg,#fff 0%,#fff 38%,var(--hud) 46%,#fff 50%,var(--brand) 54%,#fff 62%,#fff 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s ease-in-out infinite;filter:drop-shadow(0 0 10px rgba(255,45,85,.35))}
@keyframes shine{0%{background-position:120% 0}60%,100%{background-position:-30% 0}}
.logo-wrap::after{content:"";position:absolute;inset:-6px;border-radius:17px;padding:2px;background:conic-gradient(from var(--ang),transparent 0 50%,var(--hud),var(--brand),transparent 95%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:ang 4s linear infinite}
.hero h1{text-shadow:0 0 28px rgba(63,240,255,.25)}
.stat .v,.k .v,.kpi .v,.dc-main{text-shadow:0 0 16px currentColor}
.stat .v.pos,.k .v.pos{text-shadow:0 0 18px rgba(43,255,154,.55)}
.stat .v.neg,.k .v.neg{text-shadow:0 0 18px rgba(255,61,99,.55)}
.k{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px))}
.act{position:relative;overflow:hidden}
.act::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);animation:sweep 4.5s ease-in-out infinite}
.act.ent::after{animation-delay:2.2s}
@keyframes sweep{0%{left:-60%}45%,100%{left:130%}}
.act.ent{box-shadow:0 0 22px -6px rgba(43,255,154,.55),inset 0 0 18px rgba(43,255,154,.12)}
.act.sai{background:linear-gradient(135deg,var(--brand2),var(--brand) 60%,#ff6b8a);box-shadow:0 0 26px -4px rgba(255,45,85,.6)}
nav.bottom button.on span{text-shadow:0 0 10px rgba(63,240,255,.7)}
.meter>i{background:linear-gradient(90deg,var(--hud),var(--vio));box-shadow:0 0 12px var(--hud);transform-origin:left}
@keyframes barx{from{transform:scaleX(0)}}
.badge{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 22px rgba(255,45,85,1)}}
/* barras grossas de categoria com valor dentro */
.jb{position:relative;height:28px;margin-top:8px;border-radius:9px;background:#101319;border:1px solid #1d222c;overflow:hidden;transition:border-color .2s,box-shadow .2s}
.rk:hover .jb,.rk.on .jb{border-color:var(--c);box-shadow:0 0 16px -2px var(--c)}
.jb>i{position:absolute;inset:0 auto 0 0;border-radius:8px;background:var(--c);background:linear-gradient(90deg,color-mix(in srgb,var(--c) 35%,transparent),var(--c));box-shadow:0 0 14px var(--c);transform-origin:left;overflow:hidden}
.jb>i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:translateX(-100%);animation:jshine 3.4s ease-in-out 1.2s infinite}
@keyframes jshine{50%,100%{transform:translateX(100%)}}
.jb>b{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:700 12px var(--f-mono);color:#fff;text-shadow:0 0 6px rgba(0,0,0,.9)}
.jb.over{--c:var(--sai)!important} .jb.warn{--c:var(--warn)!important}
/* gráficos */
.l-sai{filter:drop-shadow(0 0 6px var(--sai));animation:lglow 3s ease-in-out infinite}
.l-ent{filter:drop-shadow(0 0 6px var(--ent))}
@keyframes lglow{50%{filter:drop-shadow(0 0 12px var(--sai))}}
.dbar{fill:var(--brand);opacity:.35}
.dbar.hi{opacity:1;filter:drop-shadow(0 0 8px var(--brand))}
.mg.hov rect.b-ent,.mg.hov rect.b-sai,.mg.hov rect.b-pos,.mg.hov rect.b-neg,.mg.sel rect.b-ent,.mg.sel rect.b-sai{filter:drop-shadow(0 0 8px currentColor)}
.b-ent,.b-pos{color:var(--ent)} .b-sai,.b-neg{color:var(--sai)}
.ping{fill:var(--sai);animation:ping 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ping{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
.seg-arc{filter:drop-shadow(0 0 5px rgba(0,0,0,.6))}
.seg-arc.hi{filter:drop-shadow(0 0 12px currentColor)}
.arc-main{animation:aglow 3s ease-in-out infinite}
@keyframes aglow{50%{filter:drop-shadow(0 0 16px var(--hud))}}
.ring2{transform-origin:120px 120px;animation:spin 24s linear infinite reverse}
.orbit{transform-origin:120px 120px;animation:spin 9s linear infinite}
#tip{border-color:var(--hud);box-shadow:0 0 26px rgba(63,240,255,.35),0 12px 32px rgba(0,0,0,.55)}
.toast{border-color:rgba(63,240,255,.45);box-shadow:0 0 26px -6px rgba(63,240,255,.5),0 12px 30px rgba(0,0,0,.5)}
.cf{border-color:transparent}
/* Google Agenda */
.gsw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(63,240,255,.03);font-size:14px}
.gsw small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.gst{display:inline-flex;align-items:center;gap:5px;margin-left:8px;padding:1px 8px;border-radius:999px;font:600 10px var(--f-mono);letter-spacing:.04em;vertical-align:1px}
.gst.ok{color:var(--ent);background:rgba(43,255,154,.08);border:1px solid rgba(43,255,154,.3)}
.gst.err{color:var(--warn);background:rgba(255,197,61,.08);border:1px solid rgba(255,197,61,.3)}
.gst.env{color:var(--hud);background:rgba(63,240,255,.08);border:1px solid rgba(63,240,255,.3)}
.gbtn{margin-left:8px;padding:1px 8px;border-radius:999px;border:1px dashed var(--line2);background:none;color:var(--hud);font:600 10px var(--f-mono);cursor:pointer;vertical-align:1px}
.gbtn:hover{border-style:solid}
@media(prefers-reduced-motion:reduce){.ledb,.scan,body::before,.logo-wrap::after{display:none}}

main.entra .meter>i,main.entra .jb>i{animation:barx 1.1s cubic-bezier(.2,.8,.2,1) both}
/* detalhe embaixo dos gráficos */
.det{margin-top:14px;border:1px solid var(--line2);border-radius:16px;background:linear-gradient(180deg,rgba(63,240,255,.06),rgba(63,240,255,.02));padding:12px 14px 10px;box-shadow:inset 0 0 30px rgba(63,240,255,.04),0 0 26px -14px var(--hud)}
.det-h{display:flex;align-items:center;gap:10px}
.det-h>div{flex:1;min-width:0;text-align:center}
.det-t{font:700 19px/1.2 var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.det-s{font-size:13px;color:var(--muted);margin-top:2px}
.det-s b{font-weight:600}
.det-nav{width:44px;height:44px;flex:none;border-radius:13px;border:1px solid var(--line2);background:rgba(255,255,255,.03);color:var(--text);font-size:22px;line-height:1;cursor:pointer;transition:border-color .2s,box-shadow .2s,transform .1s}
.det-nav:hover{border-color:var(--hud);box-shadow:0 0 14px -2px var(--hud)}
.det-nav:active{transform:scale(.92)}
.det-l{margin-top:8px}
.det-l .row,.rk-exp .row{padding:11px 0}
.det-v{margin:12px 0 4px;text-align:center;color:var(--muted);font-size:13.5px}
.det-f{display:flex;justify-content:center;padding-top:8px;margin-top:4px;border-top:1px solid var(--line)}
.det-f .link{padding:8px 4px}
.det-k{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0 6px}
.det-k div{padding:10px 6px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--line);text-align:center;min-width:0}
.det-k span{display:block;font:500 10px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.det-k b{display:block;font:700 17px/1.2 var(--f-display);margin-top:4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.day-hl{fill:rgba(63,240,255,.08);opacity:0;transition:x .12s ease,opacity .15s} .day-hl.on{opacity:1}
.chart .hint{text-align:center}
.hint{text-align:center}
.rk-exp{margin:0 0 12px;padding:2px 14px 6px;border-left:2px solid var(--c);background:rgba(255,255,255,.025);border-radius:0 12px 12px 0;animation:up .25s ease both}

.chev.up{transform:rotate(-135deg) translateY(-1px);border-color:var(--c)}

.tres{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.n3{position:relative;min-width:0;padding:14px 14px 12px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.025);overflow:hidden}
.n3::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c);box-shadow:0 0 12px var(--c)}
.n3.ent{--c:var(--ent)} .n3.sai{--c:var(--sai)} .n3.sob{--c:var(--hud)} .n3.sob.neg{--c:var(--sai)}

.n3 b{display:block;margin-top:8px;font:700 24px/1.15 var(--f-display);font-variant-numeric:tabular-nums;color:var(--text);text-shadow:0 0 16px color-mix(in srgb,var(--c) 45%,transparent);overflow-wrap:anywhere}
.n3.ent b{color:var(--ent)} .n3.sai b{color:var(--sai)} .n3.sob.neg b{color:var(--sai)}
.n3 small{display:block;margin-top:4px;font-size:12px;color:var(--muted);line-height:1.35}
.tres-c,.rc-c{container-type:inline-size}
@container (max-width:560px){.reactor-card{grid-template-columns:minmax(0,1fr);justify-items:center;gap:20px}.reactor-card .stats{width:100%}}
.n3 b{white-space:nowrap}
@container (max-width:620px){.tres{grid-template-columns:minmax(0,1fr)}.n3{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:12px}.n3 b{grid-column:2;grid-row:1/3;margin:0;text-align:right;font-size:26px}.n3 small{grid-column:1}}
.rl{display:flex;align-items:center;gap:12px;min-width:0}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:grid!important;place-items:center;justify-content:center;align-content:center;gap:0!important;padding:0;line-height:0;color:var(--c);background:rgba(255,255,255,.04);background:color-mix(in srgb,var(--c) 12%,transparent);border:1.5px solid var(--c);box-shadow:0 0 10px -3px var(--c)}
.av svg{width:19px;height:19px;display:block}
.rk-top .av{width:32px;height:32px}
.rk-top .av svg{width:16px;height:16px}
.rk-top>span:first-child{gap:10px}
.rk-v{font:700 16px var(--f-display);color:var(--text)!important;letter-spacing:.02em}
.amt{font-size:18px}
.setup{list-style:none;margin:0;padding:0;counter-reset:s;display:grid;gap:10px}
.setup li{counter-increment:s;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.02)}
.setup li::before{content:counter(s);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 14px var(--f-mono);color:var(--hud);border:1.5px solid rgba(63,240,255,.5)}
.setup li.ok{border-color:rgba(43,255,154,.35);background:rgba(43,255,154,.04)}
.setup li.ok::before{content:"✓";color:var(--bg);background:var(--ent);border-color:var(--ent);box-shadow:0 0 12px var(--ent)}
.setup b{display:block;font-weight:600}
.setup small{display:block;margin-top:3px;font-size:12.5px;line-height:1.5;color:var(--muted)}
@media(max-width:640px){.setup li{grid-template-columns:34px minmax(0,1fr)}.setup li>.ctl,.setup li>.mini-btn{grid-column:2;justify-self:start}}
.okmark{color:var(--ent);font-weight:700;font-size:18px}
.mini-btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;white-space:nowrap}
.mini-btn.pri{height:40px;padding:0 16px;border:0;background:linear-gradient(135deg,var(--brand2),var(--brand));color:#fff;font-weight:600;box-shadow:0 0 18px -4px var(--brand)}
.mini-btn:disabled{opacity:.45;cursor:default}
/* tela de entrada */
#auth{position:fixed;inset:0;z-index:100;display:grid;place-items:center;overflow-y:auto;background:radial-gradient(700px 500px at 80% -10%,rgba(255,45,85,.18),transparent 60%),radial-gradient(600px 500px at 0% 100%,rgba(164,107,255,.14),transparent 60%),var(--bg);padding:calc(24px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
#auth[hidden]{display:none}
.auth-box{width:min(100%,380px);display:grid;gap:14px;text-align:center}
.auth-box img{width:96px;height:96px;margin:0 auto;border-radius:24px;box-shadow:0 0 40px rgba(255,45,85,.45)}
.auth-box h1{margin:6px 0 0;font:700 30px/1.1 var(--f-display)}
.auth-box>p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.5}
.auth-box form{display:grid;gap:10px;margin-top:6px}
.a-msg{min-height:20px;font-size:14px;color:var(--muted);line-height:1.45}

.a-links{display:flex;justify-content:center;gap:24px}
.a-dica{margin:6px 0 0;padding:12px 14px;border-radius:12px;border:1px solid var(--line2);background:rgba(63,240,255,.05);font-size:13px;line-height:1.5;color:var(--text2);text-align:left}
body.travado{overflow:hidden}
.nlist{display:grid}
.nrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 0;border-top:1px solid var(--line)}
.nrow:first-child{border-top:0}
.ntx{min-width:0}
.ntx b{display:block;font-weight:600;font-size:15px}
.ntx small{display:block;margin-top:4px;font-size:12.5px;line-height:1.5;color:var(--muted);font-style:italic}
.ntx .link{margin-top:4px;padding:4px 0}
.ntx .link:disabled{opacity:.4;cursor:default;text-decoration:none}
@media(max-width:520px){.nrow{flex-direction:column;align-items:flex-start}.nrow>.ctl,.nrow>.sw{align-self:flex-end}}

.banner.info .ic{background:rgba(63,240,255,.12);color:var(--hud)}
/* Ajustes */
.cfgl{display:grid}
.cfgl .cfg-r{padding:15px 0;border-top:1px solid var(--line)}
.cfgl .cfg-r:first-child{border-top:0;padding-top:0}
.cfg-r>span{min-width:0}
.cfg-r small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px;line-height:1.45}
.ctl{display:flex;align-items:center;gap:10px;flex:none}
.ctl input{width:auto;padding:8px 10px;font-size:14px}
.inl{width:auto;max-width:180px;padding:9px 12px;font-size:14px}
.limg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}

.limr:focus-within{border-color:var(--hud);box-shadow:0 0 16px -4px var(--hud)}
.limr>span{min-width:0}
.limr b{display:block;font-weight:600;font-size:14px;overflow-wrap:anywhere}
.limr small{font:500 11px var(--f-mono);color:var(--muted)}
.limr small.neg{color:var(--sai)} .limr small.wrn{color:var(--warn)}
.limr input{width:110px;flex:none;padding:8px 10px;font-size:14px;text-align:right}
.chipl{display:flex;flex-wrap:wrap;gap:8px}
textarea{width:100%;min-width:0;margin:0;padding:12px 14px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--text);font:400 14px var(--f-mono);resize:vertical}
textarea:focus{outline:none;border-color:var(--hud);box-shadow:0 0 0 3px rgba(63,240,255,.12)}
.ico-box{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:start}
@media(max-width:640px){.ico-box{grid-template-columns:minmax(0,1fr)}}
.ico-fig{display:grid;gap:10px;justify-items:center;margin:0}
.ico-fig img{width:132px;height:132px;border-radius:30px;display:block;box-shadow:0 0 0 1px rgba(255,255,255,.1),0 0 34px rgba(255,45,85,.45),0 12px 30px rgba(0,0,0,.5);-webkit-touch-callout:default}
.ico-fig figcaption{font:500 10.5px var(--f-mono);letter-spacing:.06em;color:var(--muted);text-align:center;max-width:170px}
.passos{margin:0;padding:0;list-style:none;counter-reset:p;display:grid;gap:14px}
.passos li{counter-increment:p;display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;font-size:14px;line-height:1.55;color:var(--text2)}
.passos li::before{content:counter(p);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--f-mono);color:var(--hud);border:1px solid rgba(63,240,255,.45);box-shadow:0 0 12px -2px var(--hud)}
.passos b{color:var(--text)}
.linkbox{display:flex;gap:8px;margin-top:8px}
.linkbox input{font:500 12.5px var(--f-mono);padding:9px 11px}
.fab{position:fixed;z-index:35;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(98px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;display:grid;place-items:center;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--brand2),var(--brand) 55%,var(--vio));box-shadow:0 0 0 1px rgba(255,255,255,.14),0 0 26px rgba(255,45,85,.6),0 10px 24px rgba(0,0,0,.5);transition:transform .15s}
.fab svg{width:26px;height:26px}
.fab:hover{transform:scale(1.06)} .fab:active{transform:scale(.94)}
.fab::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(255,45,85,.6);opacity:0;animation:ripple 2.6s ease-out infinite}

html[data-fx="leve"] .ledb,html[data-fx="leve"] .scan,html[data-fx="leve"] body::before,html[data-fx="leve"] .logo-wrap::after,html[data-fx="leve"] .act::after,html[data-fx="leve"] .jb>i::after,html[data-fx="leve"] .fab::before{display:none}

html[data-fx="off"] *,html[data-fx="off"] *::before,html[data-fx="off"] *::after{animation:none!important;transition:none!important}
html[data-fx="off"] .ledb,html[data-fx="off"] .scan,html[data-fx="off"] body::before,html[data-fx="off"] .logo-wrap::after,html[data-fx="off"] .fab::before{display:none}

/* Desktop */
@media(min-width:900px){
  :root{--gap:26px;--pad:26px}
  body{display:grid;grid-template-columns:220px minmax(0,1fr);grid-template-areas:"head head" "nav main";padding-bottom:0}

  nav.bottom button{flex:none;flex-direction:row;gap:12px;padding:13px 14px;font-size:14px}

  nav.bottom button.on::before{top:10px;bottom:10px;left:-14px;right:auto;width:2px;height:auto}
  main{grid-area:main;grid-template-columns:repeat(12,minmax(0,1fr));max-width:1240px;margin:0;padding-block:30px 52px;padding-left:34px;padding-right:max(34px,env(safe-area-inset-right,0px))}

  .hero{padding:38px 40px 34px}

}

  S.etiquetas = S.etiquetas || [];
  [["Presentes","Presentes para pessoas"],["Empréstimos dados","Dinheiro que você emprestou a outras pessoas"],["Consórcio","Parcelas do consórcio"]].forEach(([n,d])=>{

  const catsValidas=new Set(catsAll());
  const usados={};

    if(MAPA[g.id] && (g.cat==="Outros"||!g.cat)) { g.cat=MAPA[g.id]; return; }

    g.cat = r ? r[1] : mais;
  });

async function enviarGcal(id){
  const e=S.eventos.find(x=>x.id===id); if(!e || !MCP) return;
  e.gcal={st:"env"}; save(); render();
  const ini=new Date(`${e.data}T${e.hora||"09:00"}:00`), fim=new Date(ini.getTime()+60*60000);
  try{
    const r=await MCP.callTool(GC,"create_event",{summary:e.desc,startTime:isoLocal(ini),endTime:isoLocal(fim),description:`${e.tipo} · criado pelo MindFirst`,overrideReminders:[{method:"popup",minutes:lembreteMin}],notificationLevel:"NONE"});
    const p=(r&&r.payload&&typeof r.payload==="object")?r.payload:{}, ev=(p.event&&typeof p.event==="object")?p.event:p;
    const gid=ev.id||ev.eventId||p.eventId||null, lk=ev.htmlLink||p.htmlLink;
    e.gcal={st:"ok",id:typeof gid==="string"?gid:null,link:(typeof lk==="string"&&lk.startsWith("https://"))?lk:null};
    save(); render(); som("ok");
    toast(`No Google Agenda: ${e.desc}. O celular avisa ${lembreteMin} min antes.`,null,null,"ok");
  }catch(err){
    const c=err&&err.code;
    e.gcal={st:"err",msg:GC_MSG[c]||"Não foi possível enviar ao Google Agenda."};
    save(); render(); toast(e.gcal.msg,null,null,"al");
  }
}
function apagarGcal(e){

let AC=null;
function som(tipo){
  if(!somOn) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended") AC.resume();
    const t=AC.currentTime;
    const notas = tipo==="ent"?[523,659,784,1047] : tipo==="sai"?[784,622,523] : tipo==="alerta"?[880,660,880] : [784,1175];
    notas.forEach((f,i)=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type="sine"; o.frequency.value=f;
      const s=t+i*.085; g.gain.setValueAtTime(0,s); g.gain.linearRampToValueAtTime(.07,s+.015); g.gain.exponentialRampToValueAtTime(.0001,s+.42);
      o.connect(g); g.connect(AC.destination); o.start(s); o.stop(s+.45); });
  }catch(e){}
}

const semMov = () => { if(C("efeitos")==="off") return true; try{ return matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){ return false; } };
function faiscas(x,y,cores,n,sobe,z){
  if(semMov()) return;
  const cv=document.createElement("canvas"); cv.className="fx"; if(z) cv.style.zIndex=z; document.body.appendChild(cv);
  const dpr=Math.min(2,window.devicePixelRatio||1), W=innerWidth, H=innerHeight; cv.width=W*dpr; cv.height=H*dpr;
  const ctx=cv.getContext("2d"); ctx.scale(dpr,dpr);
  const ps=Array.from({length:n},()=>{ const a=Math.random()*Math.PI*2, s=1.5+Math.random()*(n>60?8:4.5);
    return {x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(sobe?2:0),l:1,d:.011+Math.random()*.018,r:1+Math.random()*2.3,c:cores[Math.random()*cores.length|0]}; });
  (function f(){
    if(!cv.isConnected) return;
    ctx.clearRect(0,0,W,H); ctx.globalCompositeOperation="lighter"; let vivo=0;
    ps.forEach(p=>{ if(p.l<=0) return; vivo++; p.vx*=.965; p.vy=p.vy*.965+(sobe?-.05:.13); p.x+=p.vx; p.y+=p.vy; p.l-=p.d;
      const a=Math.max(0,p.l); ctx.fillStyle=p.c;
      ctx.globalAlpha=a; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
      ctx.globalAlpha=a*.22; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*3.2,0,7); ctx.fill(); });
    if(vivo) requestAnimationFrame(f); else cv.remove();
  })();
}
function contar(el,de,ate,f,ms){
  if(!el) return;
  if(semMov()){ el.textContent=f(ate); return; }
  const t0=performance.now();
  (function passo(t){ const k=Math.min(1,Math.max(0,(t-t0)/(ms||850))), e=1-Math.pow(1-k,3); el.textContent=f(de+(ate-de)*e); if(k<1&&el.isConnected) requestAnimationFrame(passo); })(t0);
}

let CH = {};
const tipEl = () => document.getElementById("tip");
function tipShow(ev,html){

  t.style.transform=`translate(${Math.round(x)}px,${Math.round(y)}px)`;
}
function tipHide(){ const t=tipEl(); if(t) t.classList.remove("on"); }
function chPos(ev,svg){ const r=svg.getBoundingClientRect(), vb=svg.viewBox.baseVal; return (ev.clientX-r.left)*vb.width/r.width; }
function chIdx(c,x){ let b=0,bd=1e9; c.xs.forEach((v,i)=>{ const d=Math.abs(v-x); if(d<bd){bd=d;b=i;} }); return b; }
function chMove(ev,el){
  const svg=el.closest("svg"), c=CH[svg.dataset.ch]; if(!c) return;
  const i=chIdx(c,chPos(ev,svg));
  if(ev.pointerType==="mouse"){ c.on(i,svg); tipShow(ev,c.tip(i)); }
  else chSel(c,i,svg);
}
function chLeave(el){ const svg=el.closest("svg"), c=CH[svg.dataset.ch]; tipHide(); if(!c) return; if(c.sel!=null) c.on(c.sel,svg); else if(c.off) c.off(svg); }
function chClick(ev,el){ const svg=el.closest("svg"), c=CH[svg.dataset.ch]; if(!c) return; tipHide(); chSel(c,chIdx(c,chPos(ev,svg)),svg,true); }
function chSel(c,i,svg,forcar){ if(c.sel===i && !forcar) return; c.sel=i; c.on(i,svg); if(c.pick) c.pick(i); }
function chPasso(id,d){ const c=CH[id], svg=document.querySelector(`svg[data-ch="${id}"]`); if(!c||!svg) return; const i=Math.max(0,Math.min(c.xs.length-1,(c.sel==null?c.xs.length-1:c.sel)+d)); chSel(c,i,svg,true); }

function arco(cx,cy,r0,r1,a0,a1){
  if(a1-a0>=Math.PI*2-1e-4) a1=a0+Math.PI*2-1e-3;
  const p=(r,a)=>[(cx+Math.sin(a)*r).toFixed(2),(cy-Math.cos(a)*r).toFixed(2)];
  const lg=(a1-a0)>Math.PI?1:0, [x0,y0]=p(r1,a0),[x1,y1]=p(r1,a1),[x2,y2]=p(r0,a1),[x3,y3]=p(r0,a0);
  return `M${x0} ${y0}A${r1} ${r1} 0 ${lg} 1 ${x1} ${y1}L${x2} ${y2}A${r0} ${r0} 0 ${lg} 0 ${x3} ${y3}Z`;
}
function segmentos(parts,cx,cy,r0,r1,acao){
  const tot=parts.reduce((a,p)=>a+p.v,0); if(!tot) return "";
  let a=0, out="";
  parts.forEach((p,i)=>{ const ang=p.v/tot*Math.PI*2, pad=(ang>.06&&parts.length>1)?.012:0;
    out+=`<path class="seg-arc${p.label===selCat?' hi sel':''}" d="${arco(cx,cy,r0,r1,a+pad,a+ang-pad)}" style="fill:${p.cor}" data-l="${esc(p.label)}" data-v="${esc(p.txt)}" data-p="${pct(p.v/tot*100)}" onpointerenter="segHi(this)" onpointerleave="segOut(this)" onclick="segClick(event,this,'${acao}')"><title>${esc(p.label)}: ${esc(p.txt)}</title></path>`;
    a+=ang; });
  return out;
}

function marcarVisto(k){ const v=vistos(); if(!v.includes(k)){ v.push(k); LS.set("mf_vistos",v.slice(-300)); } }
let ALS=[];
function alertas(){
  const A=[], m=mesHoje(), {ent,sai}=totais(m), h=hojeISO(), dia=new Date().getDate(), dm=diasNoMes(m);
  if(ent && sai>ent) A.push({k:`mes-estourou-${m}`,nivel:"crit",titulo:"As saídas passaram das entradas",texto:`Neste mês saiu ${fmt(sai-ent)} a mais do que entrou.`,tab:"financas"});
  else if(ent && sai>=ent*.8) A.push({k:`mes-80-${m}`,nivel:"warn",titulo:"80% do que entrou já saiu",texto:`Já saíram ${pct(sai/ent*100)} das entradas do mês. Restam ${fmt(ent-sai)}.`,tab:"financas"});
  if(ent && sai<=ent && dia>=5){ const proj=sai/dia*dm; if(proj>ent) A.push({k:`ritmo-${m}`,nivel:"warn",titulo:"Ritmo de gastos alto",texto:`No ritmo atual o mês fecha com ${fmt(proj)} de saídas, acima do que entrou (${fmt(ent)}).`,tab:"financas"}); }
  const pc=somaCats(m), ant=[1,2,3].map(i=>somaCats(addMes(m,-i)));
  Object.entries(pc).forEach(([c,v])=>{
    const lim=+S.limites[c]||0;
    if(lim){
      if(v>lim) A.push({k:`lim-${m}-${c}`,nivel:"crit",titulo:`${c} passou do limite`,texto:`${fmt(v)} de ${fmt(lim)} (${pct(v/lim*100)}).`,tab:"financas",cat:c});
      else if(v>=lim*.8) A.push({k:`lim80-${m}-${c}`,nivel:"warn",titulo:`${c} perto do limite`,texto:`${fmt(v)} de ${fmt(lim)} já usados (${pct(v/lim*100)}).`,tab:"financas",cat:c});
    }
    const hist=ant.map(o=>o[c]||0).filter(x=>x>0);
    if(hist.length>=2){ const med=hist.reduce((a,b)=>a+b,0)/hist.length;
      if(v>med*1.3 && v-med>50) A.push({k:`pico-${m}-${c}`,nivel:"warn",titulo:`Você está gastando mais com ${c}`,texto:`${fmt(v)} neste mês, contra uma média de ${fmt(med)} nos meses anteriores (+${pct((v/med-1)*100)}).`,tab:"financas",cat:c}); }
  });
  const gs=S.gastos.filter(g=>g.mes===m);
  if(gs.length>=5){ const med=gs.reduce((a,g)=>a+g.valor,0)/gs.length;
    gs.filter(g=>(g.data||"")>=addDias(h,-2) && g.valor>med*3 && g.valor>=100).forEach(g=>A.push({k:`grande-${g.id}`,nivel:"info",titulo:"Gasto acima do normal",texto:`${g.desc}: ${fmt(g.valor)} em ${dataBR(g.data)}, cerca de ${num(g.valor/med)}× o seu gasto médio.`,tab:"financas"})); }
  const pend=S.eventos.filter(e=>!e.feito);
  const atr=pend.filter(e=>e.data<h);
  if(atr.length) A.push({k:`atrasados-${h}-${atr.length}`,nivel:"warn",titulo:`${atr.length} ${atr.length===1?"item atrasado":"itens atrasados"} na agenda`,texto:atr.slice(0,3).map(e=>e.desc).join(", ")+(atr.length>3?"…":""),tab:"agenda"});
  const hoje=pend.filter(e=>e.data===h).sort((a,b)=>(a.hora||"").localeCompare(b.hora||""));
  hoje.forEach(e=>{ const d=minAte(e.hora); if(d!==null && d>=-30 && d<=60)
    A.push({k:`perto-${e.id}`,nivel:d<=15?"warn":"info",titulo:d>0?`Em ${d} min: ${e.desc}`:d===0?`Agora: ${e.desc}`:`Começou há ${-d} min: ${e.desc}`,texto:`${e.tipo} às ${e.hora}.`,tab:"agenda"}); });
  if(hoje.length) A.push({k:`hoje-${h}-${hoje.length}`,nivel:"info",titulo:`${hoje.length} ${hoje.length===1?"tarefa":"tarefas"} para hoje`,texto:hoje.map(e=>`${e.hora} ${e.desc}`).join(" · "),tab:"agenda"});
  const amanha=pend.filter(e=>e.data===addDias(h,1));
  if(amanha.length && new Date().getHours()>=18) A.push({k:`amanha-${h}`,nivel:"info",titulo:`Amanhã: ${amanha.length} ${amanha.length===1?"compromisso":"compromissos"}`,texto:amanha.map(e=>`${e.hora} ${e.desc}`).join(" · "),tab:"agenda"});
  const ult=[...S.metricas].sort((a,b)=>b.data.localeCompare(a.data))[0];
  if(ult && ult.gasto>0 && div(ult.receita,ult.gasto)<1 && ult.data>=addDias(h,-3)) A.push({k:`roas-${ult.id}`,nivel:"warn",titulo:"Campanha no prejuízo",texto:`${ult.oferta||"Oferta"} em ${dataBR(ult.data)}: ROAS de ${num(div(ult.receita,ult.gasto))}x.`,tab:"metricas"});
  const ord={crit:0,warn:1,info:2}, al=C("al");
  const tpDe=k=>/^mes-|^ritmo/.test(k)?"saldo":/^lim/.test(k)?"limites":/^pico|^grande/.test(k)?"exagero":/^roas/.test(k)?"campanhas":"agenda";
  ALS = A.map(a=>(a.tp=tpDe(a.k),a)).filter(a=>al[a.tp]!==false).sort((a,b)=>ord[a.nivel]-ord[b.nivel]);
  return ALS;
}

function quandoDia(iso){ const h=hojeISO(), base=`${diaSemana(iso)} ${dataBR(iso)}`; return iso===h?`Hoje · ${base}`:iso===addDias(h,-1)?`Ontem · ${base}`:base; }
function linhaDet(l,comData){
  const s=l.tipo==="saida";
  return `<div class="row"><div class="rl">${avatar(s?l.cat:l.label,!s)}<div class="rt"><div class="n">${esc(l.label)}</div><div class="tag">${comData&&l.data?dataBR(l.data)+" · ":""}${s?esc(l.cat||""):"Entrada"}</div></div></div><span class="amt ${s?'neg':'pos'}">${s?'−':'+'} ${fmtK(l.valor,s?'sai':'ent')}</span></div>`;
}
const detNav = (id,lado) => `<button class="det-nav" aria-label="${lado<0?"Anterior":"Próximo"}" onclick="chPasso('${id}',${lado})">${lado<0?"‹":"›"}</button>`;
function detalheDia(id,m,iso,destino){
  const doDia=x=>(x.data||x.mes+"-01")===iso;
  const g=S.gastos.filter(doDia).sort((a,b)=>b.valor-a.valor), r=S.recebimentos.filter(doDia);
  const ts=g.reduce((a,x)=>a+x.valor,0), te=r.reduce((a,x)=>a+x.valor,0);
  const itens=[...r.map(x=>({...x,tipo:"entrada",label:x.fonte})),...g.map(x=>({...x,tipo:"saida",label:x.desc}))];
  const resumo = ts||te ? [ts?`saiu <b class="neg">${fmtK(ts,"sai")}</b>`:"", te?`entrou <b class="pos">${fmtK(te,"ent")}</b>`:""].filter(Boolean).join(" · ") : "sem lançamentos";
  const rodape = destino==="ir" ? `<button class="link" onclick="abrirDiaFin('${iso}')">Ver em Finanças ›</button>` : (itens.length?`<button class="link" onclick="filtrarDia('${iso}')">Mostrar só este dia na lista ›</button>`:"");
  return `<div class="det-h">${detNav(id,-1)}<div><div class="det-t">${quandoDia(iso)}</div><div class="det-s">${resumo}</div></div>${detNav(id,1)}</div>
    ${itens.length?`<div class="det-l">${itens.map(l=>linhaDet(l)).join("")}</div>`:`<p class="det-v">Nada lançado neste dia.</p>`}
    ${rodape?`<div class="det-f">${rodape}</div>`:""}`;
}
function abrirDiaFin(iso){ filtroDia=iso; filtroCat=null; selDia=iso; const mm=iso.slice(0,7); S.mesSel=mm===mesHoje()?null:mm; periodo="mes"; gravar("mf_periodo","mes"); go("financas",true); setTimeout(()=>irPara("lanc"),350); }

function abrirMes(mm){ S.mesSel = mm===mesHoje()?null:mm; periodo="mes"; gravar("mf_periodo","mes"); filtroDia=null; filtroCat=null; selDia=null; save(); render(); animarEntrada(); try{ window.scrollTo({top:0,behavior:semMov()?"auto":"smooth"}); }catch(e){} }

/* gráfico diário (acumulado do mês) */
function graficoDias(m,destino){
  const dm=diasNoMes(m), ate = m===mesHoje()? new Date().getDate() : (m<mesHoje()? dm : 0);
  if(!ate) return '<div class="empty">Este mês ainda não começou.</div>';
  const gd=Array(dm).fill(0), ed=Array(dm).fill(0);
  const diaDe = x => Math.min(dm,Math.max(1,+String(x.data||"").slice(8,10)||1));
  S.gastos.forEach(g=>{ if(g.mes===m) gd[diaDe(g)-1]+=g.valor; });
  S.recebimentos.forEach(r=>{ if(r.mes===m) ed[diaDe(r)-1]+=r.valor; });
  const cs=[], ce=[]; let a=0,b=0; for(let i=0;i<dm;i++){ a+=gd[i]; b+=ed[i]; cs.push(a); ce.push(b); }
  if(!cs[ate-1] && !ce[ate-1]) return '<div class="empty">Nenhum lançamento neste mês ainda.<br>Use + Entrou ou − Saiu para começar.</div>';
  const mob=ehMob(), W=mob?400:720, H=mob?250:260, pl=mob?52:62, pr=mob?10:14, pt=20, pb=30, iw=W-pl-pr, ih=H-pt-pb, step=iw/dm;
  const top=niceCeil(Math.max(cs[ate-1],ce[ate-1],...gd));
  const X=i=>pl+(i+.5)*step, Y=v=>pt+ih-(v/top)*ih, base=pt+ih;
  const id=novoId("cd"), oc=ocultarEnt||ocultarSai;
  const grid=[0,.25,.5,.75,1].map(f=>`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${Y(top*f).toFixed(1)}" y2="${Y(top*f).toFixed(1)}"/>${f===0||f===.5||f===1?`<text class="ax" x="${pl-8}" y="${(Y(top*f)+3.5).toFixed(1)}" text-anchor="end">${oc?"•••":fmtMil(top*f)}</text>`:""}`).join("");
  const marcas=[...new Set([1,5,10,15,20,25,dm])].filter(d=>d<=dm && (d===dm || dm-d>2));
  const ticks=marcas.map(d=>`<text class="mx" x="${X(d-1).toFixed(1)}" y="${H-8}" text-anchor="middle">${d}</text>`).join("");
  const bw=Math.max(3,step*.6);
  const bars=gd.slice(0,ate).map((v,i)=>v?`<rect class="dbar grow" data-i="${i}" x="${(X(i)-bw/2).toFixed(1)}" y="${Y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${(base-Y(v)).toFixed(1)}" rx="1.5"/>`:"").join("");
  const pts=arr=>arr.slice(0,ate).map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`);
  const ps=pts(cs), pe=pts(ce);
  const area=`M${X(0).toFixed(1)},${base} L${ps.join(" L")} L${X(ate-1).toFixed(1)},${base} Z`;
  let i0 = (selDia && selDia.slice(0,7)===m) ? (+selDia.slice(8,10))-1 : ate-1;
  if(!(i0>=0 && i0<ate)) i0=ate-1;
  CH[id]={xs:Array.from({length:ate},(_,i)=>X(i)), sel:i0,
    on(i,svg){ const x=X(i).toFixed(1); const cr=svg.querySelector(".cross"); cr.setAttribute("x1",x); cr.setAttribute("x2",x); cr.classList.add("on");
      const hl=svg.querySelector(".day-hl"); hl.setAttribute("x",(X(i)-step/2).toFixed(1)); hl.classList.add("on");
      const d1=svg.querySelector(".hd-s"), d2=svg.querySelector(".hd-e"); d1.setAttribute("cx",x); d1.setAttribute("cy",Y(cs[i]).toFixed(1)); d1.classList.add("on"); d2.setAttribute("cx",x); d2.setAttribute("cy",Y(ce[i]).toFixed(1)); d2.classList.toggle("on",ce[ate-1]>0);
      svg.querySelectorAll(".dbar").forEach(r=>r.classList.toggle("hi",+r.dataset.i===i)); },
    tip(i){ const iso=`${m}-${p2(i+1)}`; return `<div class="tt">${diaSemana(iso)} · ${dataBR(iso)}</div>${tr("Saiu no dia",fmtK(gd[i],"sai"),"neg")}${ed[i]?tr("Entrou no dia",fmtK(ed[i],"ent"),"pos"):""}${tr("Saiu no mês até aqui",fmtK(cs[i],"sai"))}${tr("Entrou no mês até aqui",fmtK(ce[i],"ent"))}<div class="th">Clique para ver os lançamentos abaixo</div>`; },
    pick(i){ const iso=`${m}-${p2(i+1)}`; selDia=iso; const d=document.getElementById("det-"+id); if(d) d.innerHTML=detalheDia(id,m,iso,destino); }
  };
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" data-ch="${id}" role="img" aria-label="Entradas e saídas acumuladas no mês, dia a dia">
    <defs><linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff3d63" stop-opacity=".45"/><stop offset="1" stop-color="#ff3d63" stop-opacity="0"/></linearGradient></defs>
    <rect class="day-hl" x="0" y="${pt}" width="${step.toFixed(1)}" height="${ih}" rx="4"/>
    ${grid}${ticks}${bars}
    <path class="fadein" d="${area}" style="fill:url(#${id}g)"/>
    ${ce[ate-1]?`<polyline class="l-ent draw" pathLength="1" points="${pe.join(" ")}"/>`:""}
    <polyline class="l-sai draw" pathLength="1" points="${ps.join(" ")}"/>
    ${m===mesHoje()&&cs[ate-1]?`<circle class="ping" cx="${X(ate-1).toFixed(1)}" cy="${Y(cs[ate-1]).toFixed(1)}" r="4"/>`:""}
    <line class="cross" x1="0" x2="0" y1="${pt}" y2="${base}"/>
    <circle class="hdot hd-e" r="5" style="stroke:var(--ent)"/><circle class="hdot hd-s" r="5" style="stroke:var(--sai)"/>
    <rect class="hit" x="${pl-6}" y="0" width="${iw+12}" height="${H}" onpointermove="chMove(event,this)" onpointerleave="chLeave(this)" onclick="chClick(event,this)"/>
  </svg></div>
  <p class="hint">Toque num dia ou arraste o dedo pelo gráfico</p>
  <div class="det" id="det-${id}" aria-live="polite">${detalheDia(id,m,`${m}-${p2(i0+1)}`,destino)}</div>`;
}
/* gráfico de 6 meses */
function detalheMes(id,x,aberto){
  const s=x.ent-x.sai, oc=ocultarEnt||ocultarSai, top=Object.entries(somaCats(x.m)).sort((a,b)=>b[1]-a[1])[0];
  return `<div class="det-h">${detNav(id,-1)}<div><div class="det-t">${mesLongo(x.m)}</div><div class="det-s">${top?`maior saída: <b>${esc(top[0])}</b>`:"sem saídas"}</div></div>${detNav(id,1)}</div>
    <div class="det-k"><div><span>Entrou</span><b class="pos">${fmtK(x.ent,"ent")}</b></div><div><span>Saiu</span><b class="neg">${fmtK(x.sai,"sai")}</b></div><div><span>Sobrou</span><b class="${s>=0?'pos':'neg'}">${oc?"R$ •••••":fmt(s)}</b></div></div>
    <div class="det-f">${x.m===aberto?`<span class="tag">Este é o mês aberto agora</span>`:`<button class="link" onclick="abrirMes('${x.m}')">Abrir ${mesLongo(x.m)} ›</button>`}</div>`;
}
function graficoMeses(m){

  const Y=v=>pt+ih-(v/top)*ih, base=pt+ih, oc=ocultarEnt||ocultarSai, id=novoId("cm");
  const grid=[0,.5,1].map(f=>`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${Y(top*f)}" y2="${Y(top*f)}"/><text class="ax" x="${pl-8}" y="${Y(top*f)+3.5}" text-anchor="end">${oc?"•••":fmtMil(top*f)}</text>`).join("");
  const xs=d.map((x,i)=>pl+gw*i+gw/2);

    return `<g class="mg" data-i="${i}"><rect class="hl-col" x="${cx-gw/2+3}" y="${pt}" width="${gw-6}" height="${ih}" rx="8"/><rect class="b-ent grow" x="${cx-bw-2}" y="${Y(x.ent)}" width="${bw}" height="${base-Y(x.ent)}" rx="4" style="fill:url(#${id}e);animation-delay:${i*.06}s"/><rect class="b-sai grow" x="${cx+2}" y="${Y(x.sai)}" width="${bw}" height="${base-Y(x.sai)}" rx="4" style="fill:url(#${id}s);animation-delay:${i*.06+.03}s"/><text class="mx" x="${cx}" y="${H-8}" text-anchor="middle">${mesCurto(x.m)}</text></g>`; }).join("");
  CH[id]={xs, sel:5,
    on(i,svg){ svg.querySelectorAll(".mg").forEach(g=>{ const on=+g.dataset.i===i; g.classList.toggle("sel",on); g.querySelector(".hl-col").classList.toggle("on",on); }); },
    tip(i){ const x=d[i], s=x.ent-x.sai; return `<div class="tt">${mesLongo(x.m)}</div>${tr("Entrou",fmtK(x.ent,"ent"),"pos")}${tr("Saiu",fmtK(x.sai,"sai"),"neg")}${tr("Sobrou",oc?"R$ •••••":fmt(s),s>=0?"pos":"neg")}<div class="th">Clique para ver o resumo abaixo</div>`; },
    pick(i){ const el=document.getElementById("det-"+id); if(el) el.innerHTML=detalheMes(id,d[i],m); }

  <p class="hint">Toque num mês para ver o resumo</p>
  <div class="det" id="det-${id}" aria-live="polite">${detalheMes(id,d[5],m)}</div>`;
}
/* gráfico de lucro por dia (métricas) */
function graficoLucro(){
  const por={}; S.metricas.forEach(x=>{ const k=x.data; por[k]=por[k]||{gasto:0,receita:0,vendas:0,ofertas:new Set()}; por[k].gasto+=+x.gasto||0; por[k].receita+=+x.receita||0; por[k].vendas+=+x.vendas||0; if(x.oferta) por[k].ofertas.add(x.oferta); });
  const dias=Object.keys(por).sort().slice(-14);
  if(!dias.length) return '<div class="empty">Registre um dia de campanha para ver o lucro dia a dia.</div>';
  const L=dias.map(k=>por[k].receita-por[k].gasto), mx=niceCeil(Math.max(1,...L.map(Math.abs)));
  const mob=ehMob(), W=mob?400:560, H=mob?240:230, pl=mob?52:62, pr=8, pt=12, pb=30, iw=W-pl-pr, ih=H-pt-pb, gw=iw/Math.max(dias.length,4), bw=Math.min(28,gw*.55);
  const temNeg=L.some(v=>v<0), lo=temNeg?-mx:0, Y=v=>pt+ih-((v-lo)/(mx-lo))*ih, z=Y(0), id=novoId("cl");
  const xs=dias.map((_,i)=>pl+gw*i+gw/2);
  const marcas=temNeg?[lo,0,mx]:[0,mx/2,mx];
  const grid=marcas.map(v=>`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${pl-8}" y="${Y(v)+3.5}" text-anchor="end">${v<0?"−":""}${fmtMil(Math.abs(v))}</text>`).join("");
  const bars=dias.map((k,i)=>{ const v=L[i], y=v>=0?Y(v):z, h=Math.max(1,Math.abs(Y(v)-z));
    return `<g class="mg" data-i="${i}"><rect class="hl-col" x="${xs[i]-gw/2+3}" y="${pt}" width="${gw-6}" height="${ih}" rx="8"/><rect class="${v>=0?'b-pos':'b-neg'} grow" x="${xs[i]-bw/2}" y="${y}" width="${bw}" height="${h}" rx="4" style="transform-origin:50% ${v>=0?'100%':'0%'}"/><text class="mx" x="${xs[i]}" y="${H-8}" text-anchor="middle">${dias.length>8&&i%2?"":dataBR(k)}</text></g>`; }).join("");
  const det=(i)=>{ const p=por[dias[i]], r=div(p.receita,p.gasto), l=p.receita-p.gasto;
    return `<div class="det-h">${detNav(id,-1)}<div><div class="det-t">${quandoDia(dias[i])}</div><div class="det-s">${p.ofertas.size?esc([...p.ofertas].join(", ")):"Oferta"} · ROAS <b class="${r>=1?'pos':'neg'}">${num(r)}x</b> · ${num(p.vendas)} vendas</div></div>${detNav(id,1)}</div>
      <div class="det-k"><div><span>Gasto</span><b>${fmt(p.gasto)}</b></div><div><span>Receita</span><b>${fmt(p.receita)}</b></div><div><span>${l>=0?"Lucro":"Prejuízo"}</span><b class="${l>=0?'pos':'neg'}">${fmt(Math.abs(l))}</b></div></div>`; };
  CH[id]={xs, sel:dias.length-1,
    on(i,svg){ svg.querySelectorAll(".mg").forEach(g=>{ const on=+g.dataset.i===i; g.classList.toggle("sel",on); g.querySelector(".hl-col").classList.toggle("on",on); }); },
    tip(i){ const p=por[dias[i]], r=div(p.receita,p.gasto); return `<div class="tt">${diaSemana(dias[i])} · ${dataBR(dias[i])}</div>${tr("Gasto",fmt(p.gasto))}${tr("Receita",fmt(p.receita))}${tr("Lucro",fmt(p.receita-p.gasto),p.receita>=p.gasto?"pos":"neg")}${tr("ROAS",num(r)+"x",r>=1?"pos":"neg")}`; },
    pick(i){ const el=document.getElementById("det-"+id); if(el) el.innerHTML=det(i); }
  };
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" data-ch="${id}" role="img" aria-label="Lucro por dia das campanhas">${grid}<line x1="${pl}" x2="${W-pr}" y1="${z}" y2="${z}" style="stroke:rgba(63,240,255,.3);stroke-width:1"/>${bars}<rect class="hit" x="${pl}" y="0" width="${iw}" height="${H}" onpointermove="chMove(event,this)" onpointerleave="chLeave(this)" onclick="chClick(event,this)"/></svg></div>
  <p class="hint">Toque num dia para ver os números</p>
  <div class="det" id="det-${id}" aria-live="polite">${det(dias.length-1)}</div>`;
}

/* ---------- INÍCIO ---------- */
function saudacao(){ const h=new Date().getHours(); return h<5?"Boa noite":h<12?"Bom dia":h<18?"Boa tarde":"Boa noite"; }
function briefing(){
  const m=mesHoje(), {ent,sai}=totais(m), hoje=hojeISO(), oc=ocultarEnt||ocultarSai;
  if(!S.gastos.length && !S.recebimentos.length && !S.eventos.length) return "Tudo pronto. Registre sua primeira entrada ou saída nos botões abaixo.";
  const p=[];
  if(oc) p.push("Os valores estão ocultos.");
  else if(ent||sai){
    let s=`Neste mês entraram <b>${fmt(ent)}</b> e saíram <b>${fmt(sai)}</b>`;
    s += !ent ? "." : sai>ent ? `, <b>${fmt(sai-ent)}</b> acima do que entrou.` : `. Sobraram <b>${fmt(ent-sai)}</b>.`;
    p.push(s);
  } else p.push("Nenhum lançamento neste mês ainda.");
  const gh=S.gastos.filter(g=>g.data===hoje).reduce((a,g)=>a+g.valor,0);
  if(!oc) p.push(gh ? `Hoje você já gastou <b>${fmt(gh)}</b>.` : "Nenhum gasto registrado hoje.");
  const top=Object.entries(somaCats(m)).sort((a,b)=>b[1]-a[1])[0];
  if(top) p.push(`Maior saída do mês: <b>${esc(top[0])}</b>.`);
  const agora=new Date().toTimeString().slice(0,5);
  const pend=S.eventos.filter(e=>e.data===hoje&&!e.feito).sort((a,b)=>(a.hora||"").localeCompare(b.hora||""));
  const prox=pend.find(e=>(e.hora||"")>=agora)||pend[0];
  if(pend.length) p.push(`${pend.length===1?"Uma tarefa":pend.length+" tarefas"} para hoje. Próxima: <b>${esc(prox.desc)}</b>${prox.hora?" às "+prox.hora:""}.`);
  else p.push("Agenda de hoje livre.");
  return p.join(" ");
}

  const dia=new Date().getDate();
  const tarefas=S.eventos.filter(e=>e.data===hoje).sort((a,b)=>(a.hora||"").localeCompare(b.hora||""));
  const ult=[...S.gastos.map(g=>({...g,tipo:"saida",label:g.desc,date:g.data||g.mes+"-01"})),...S.recebimentos.map(r=>({...r,tipo:"entrada",label:r.fonte,date:r.data||r.mes+"-01"}))]
    .sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id)).slice(0,5);
  const cats=Object.entries(somaCats(m)).sort((a,b)=>b[1]-a[1]), totC=cats.reduce((a,[,v])=>a+v,0);
  return `
  <section class="panel hero glow hudc">${LED}
    <div class="ph" style="margin:0"><div class="kick">Briefing · ${new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"})}</div><span class="live"><i></i>${dbReady?"Sincronizado":"Ao vivo"}</span></div>
    <h1>${saudacao()}, ${esc(C("nome")||NOME)}.</h1>
    <p class="brief">${briefing()}</p>
    <div class="quote">${FRASES[fraseIdx]}</div>
  </section>
  ${bannerImport()}${bannerHTML()}
  <section class="panel s7 glow">${LED}
    <div class="ph"><h2>Seu dinheiro em ${mesLongo(m)}</h2><button class="link" onclick="go('financas')">Finanças ›</button></div>
    ${tresNumeros(ent,sai)}
    <div class="rc-c"><div class="reactor-card" style="margin-top:22px">${reator(m)}
      <div class="stats">
        <div class="stat"><span class="sl">Gastou hoje</span><span class="v">${fmtK(gHoje,"sai")}</span></div>
        <div class="stat"><span class="sl">Média de gasto por dia</span><span class="v">${fmtK(sai/dia,"sai")}</span></div>
        <div class="stat"><span class="sl">Do que entrou, já saiu</span><span class="v ${ent&&sai>ent?'neg':''}">${ent?pct(sai/ent*100):"—"}</span></div>
      </div>
    </div></div>
    <p class="psub" style="margin-top:14px">Anel de fora: cada cor é uma categoria de gasto (toque para ver). Anel de dentro: quanto do que entrou já saiu.</p>
    ${acoes()}

/* ---------- FINANÇAS ---------- */
function ritmo(m,sai){
  if(periodo==="hoje") return {l:"Lançamentos",v:String(recPer(m).length+gasPer(m).length),s:"registrados hoje"};
  if(periodo==="7d") return {l:"Média por dia",v:fmtK(sai/7,"sai"),s:"saídas ÷ 7 dias"};
  const dm=diasNoMes(m);
  if(m===mesHoje()){ const med=sai/new Date().getDate(); return {l:"Média de gasto por dia",v:fmtK(med,"sai"),s:"se continuar assim, o mês fecha com "+fmtK(med*dm,"sai")+" de saídas"}; }
  if(m>mesHoje()) return {l:"Média por dia",v:fmtK(0,"sai"),s:"mês ainda não começou"};
  return {l:"Média por dia",v:fmtK(sai/dm,"sai"),s:`saídas ÷ ${dm} dias`};
}

  const ranks=mapaRank(m), totR=ranks.reduce((a,[,v])=>a+v,0), k=rankTipo==="saidas"?"sai":"ent";

  return `

      <div class="k"><div class="l">Entrou</div><div class="v pos">${fmtK(ent,"ent")}</div><div class="s">${recPer(m).length} lançamentos</div></div>
      <div class="k"><div class="l">Saiu</div><div class="v neg">${fmtK(sai,"sai")}</div><div class="s">${gasPer(m).length} lançamentos</div></div>
      <div class="k"><div class="l">${rt.l}</div><div class="v">${rt.v}</div><div class="s">${rt.s}</div></div>

    <p class="psub">Linha vermelha: total que já saiu no mês. Linha verde: total que entrou. Barrinhas: gasto de cada dia.</p>

function abrirSheet(t){ sheetOpen=true; sheetTipo=t; renderSheet(); setTimeout(()=>{ const i=document.getElementById("s-val"); if(i) i.focus(); },60); }

function setTipoSheet(t){ const v=document.getElementById("s-val")?.value||"", d=document.getElementById("s-data")?.value; sheetTipo=t; renderSheet(); const i=document.getElementById("s-val"); if(i){ i.value=v; i.focus(); } if(d) document.getElementById("s-data").value=d; }

        : `<select id="s-cat" aria-label="Categoria" onchange="etiquetaMudou(this.value)">${catsAll().map(c=>`<option ${c===S.ultimaCat?'selected':''}>${esc(c)}</option>`).join("")}<option value="__nova__">+ Criar etiqueta</option></select>`}
    </div>

      ? `<input id="s-fonte-txt" placeholder="Ou digite o que entrou (ex.: venda de curso, freela)" autocomplete="off" ${enter}>`

    <div class="g2" style="margin-top:6px">
      <button class="btn sec" onclick="fecharSheet()">Cancelar</button>

function registrar(tipo,valor,data,cat,descr){
  const mes=data.slice(0,7), id=String(Date.now());
  if(tipo==="entrada") S.recebimentos.push({id,mes,data,fonte:cat,valor});
  else { S.gastos.push({id,mes,data,desc:descr||cat,valor,cat}); S.ultimaCat=cat; }
  S.mesSel=null;
  save();
}
function salvarLanc(){
  const valor=parseValor(document.getElementById("s-val").value);
  const erro=t=>{ const e=document.getElementById("s-erro"); if(e) e.textContent=t; };
  if(!valor || valor<=0){ erro("Digite um valor maior que zero (ex.: 150,00)."); return; }
  const data=document.getElementById("s-data").value || hojeISO();
  let cat, descr="";
  if(sheetTipo==="entrada"){
    const livre=(document.getElementById("s-fonte-txt")?.value||"").trim();
    cat = livre || document.getElementById("s-cat").value;
  }else{
    cat=document.getElementById("s-cat").value;
    if(cat==="__nova__"){
      const nome=(document.getElementById("s-nova-nome").value||"").trim();
      if(!nome){ erro("Dê um nome para a nova etiqueta."); return; }
      const dn=(document.getElementById("s-nova-desc").value||"").trim();
      S.etiquetas = S.etiquetas || [];
      if(!S.etiquetas.find(e=>e.nome===nome)){ S.etiquetas.push({nome,descr:dn}); marcarTs("etiquetas"); }
      cat=nome;
    }
    descr=(document.getElementById("s-desc").value||"").trim();
  }
  const antes=new Set(alertas().map(a=>a.k));
  registrar(sheetTipo,valor,data,cat,descr);
  sheetOpen=false;
  render();
  telaConfirma({tipo:sheetTipo, valor, cat, desc:descr, data});
  alertasParaCelular(alertas().filter(a=>!antes.has(a.k) && a.nivel!=="info" && ["saldo","limites","exagero"].includes(a.tp)));
}
function etiquetaMudou(v){
