  if(hint) hint.textContent = v==="__nova__" ? "Crie uma etiqueta com nome e descrição." : descCat(v);
}
function telaConfirma(o){
  document.getElementById("confirma")?.remove();
  const entrada=o.tipo==="entrada", cor=entrada?"#2bff9a":"#ff3d63", oc=ocultarEnt||ocultarSai;
  const m=o.data.slice(0,7), t=totais(m), sobra=t.ent-t.sai, antes=entrada?sobra-o.valor:sobra+o.valor;
  const avisos=[];
  if(!entrada){
    const v=somaCats(m)[o.cat]||0, lim=+S.limites[o.cat]||0;
    if(lim && v>lim && v-o.valor<=lim) avisos.push(`Com este gasto, ${o.cat} passou do limite de ${fmt(lim)} no mês.`);
    else if(lim && v>=lim*.8 && v-o.valor<lim*.8) avisos.push(`${o.cat} chegou a ${pct(v/lim*100)} do limite do mês.`);
    if(t.ent && t.sai>t.ent && t.sai-o.valor<=t.ent) avisos.push("As saídas do mês passaram das entradas.");
    else if(t.ent && t.sai>=t.ent*.8 && t.sai-o.valor<t.ent*.8) avisos.push("Você já gastou 80% do que entrou neste mês.");
  }
  const ov=document.createElement("div"); ov.id="confirma";
  ov.innerHTML=`<div class="cf" role="dialog" aria-modal="true" aria-label="Lançamento registrado" style="--glow:${entrada?'rgba(43,255,154,.18)':'rgba(255,61,99,.18)'}">
    <div class="orb" style="--c:${cor}"><i></i><i></i><i></i><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="46" style="fill:${entrada?'rgba(43,255,154,.08)':'rgba(255,61,99,.08)'}"/><circle class="cf-ring" cx="60" cy="60" r="46" style="fill:none;stroke:${cor};stroke-width:3"/><path class="cf-ok" d="M41 61 L54 74 L80 47" style="fill:none;stroke:${cor};stroke-width:6;stroke-linecap:round;stroke-linejoin:round"/></svg></div>
    <div class="cf-t">${entrada?"Entrada registrada":"Saída registrada"}</div>
    <div class="cf-v" id="cf-v" style="color:${cor}">${entrada?"+":"−"} ${fmtK(o.valor,entrada?"ent":"sai")}</div>
    <div class="cf-d">${esc(o.cat)}${o.desc&&o.desc!==o.cat?" · "+esc(o.desc):""}<br>${diaSemana(o.data)}, ${dataBR(o.data)}</div>
    ${oc?"":`<div class="cf-imp"><span>Sobrou em ${mesCurto(m)}</span><b id="cf-s" class="${sobra>=0?'pos':'neg'}">${fmt(sobra)}</b></div>`}
    ${avisos.map(a=>`<div class="cf-warn">${ICON.warn}<span>${esc(a)}</span></div>`).join("")}
    <div class="g2" style="margin-top:18px"><button class="btn sec" id="cf-outra">Registrar outra</button><button class="btn" id="cf-ok">Continuar</button></div>
  </div>`;
  ov.addEventListener("click",e=>{ if(e.target===ov) ov.remove(); });
  document.body.appendChild(ov);
  const ok=document.getElementById("cf-ok"); ok.onclick=()=>ov.remove(); ok.focus();
  document.getElementById("cf-outra").onclick=()=>{ ov.remove(); abrirSheet(o.tipo); };
  const k=entrada?"ent":"sai";
  if(!((k==="ent"&&ocultarEnt)||(k==="sai"&&ocultarSai))) contar(document.getElementById("cf-v"),0,o.valor,v=>(entrada?"+ ":"− ")+fmtRaw(v),900);
  if(!oc){ const es=document.getElementById("cf-s"); es.textContent=fmt(antes); setTimeout(()=>contar(es,antes,sobra,fmtRaw,900),550); }
  const orb=ov.querySelector(".orb").getBoundingClientRect();
  faiscas(orb.left+orb.width/2, orb.top+orb.height/2, entrada?["#2bff9a","#3ff0ff","#d9fff0","#ffc53d"]:["#ff3d63","#ff2d55","#3ff0ff","#ffd0d5"], 130, entrada, 61);
  som(entrada?"ent":"sai"); vibrar(entrada?[30,40,30]:40);
  if(avisos.length){ setTimeout(()=>{ som("alerta"); atualizarSino(); },1100); }
}
function toast(msg,acao,fn,icone){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status");
  if(icone){ const i=document.createElement("span"); i.className="ti "+icone; i.innerHTML=icone==="ok"?ICON.check:icone==="al"?ICON.bell:ICON.info; t.appendChild(i); }
  const s=document.createElement("span"); s.className="tm"; s.textContent=msg; t.appendChild(s);
  if(acao){ const b=document.createElement("button"); b.textContent=acao; b.onclick=()=>{ t.remove(); fn(); }; t.appendChild(b); }
  document.body.appendChild(t); setTimeout(()=>t.remove(), acao?6500:3000);
}
function delItem(col,id){
  const i=S[col].findIndex(x=>x.id===id); if(i<0) return;
  const [item]=S[col].splice(i,1); save(); render();
  let apagouGoogle=false;
  if(col==="eventos" && item.gcal && item.gcal.id){ apagarGcal(item); apagouGoogle=true; }
  toast(col==="eventos"?(apagouGoogle?"Removido daqui e do Google Agenda":"Item removido da agenda"):col==="metricas"?"Dia removido":"Lançamento removido","Desfazer",()=>{ if(apagouGoogle) delete item.gcal; S[col].splice(i,0,item); save(); render(); },"info");
}
document.addEventListener("keydown",e=>{

  const grupos=[["Atrasados",pend.filter(e=>e.data<h),"warn"],["Hoje",pend.filter(e=>e.data===h),""],["Amanhã",pend.filter(e=>e.data===am),""],["Próximos",pend.filter(e=>e.data>am),""]].filter(g=>g[1].length);
  const feitos=S.eventos.filter(e=>e.feito).sort((a,b)=>ord(b,a));

      <p class="note" style="margin:0">Com as notificações ativadas em Ajustes, o celular avisa ${lembreteMin} min antes.</p>
      <button class="btn" onclick="addEvento()">Adicionar à agenda</button>

    ${feitos.length?`<div class="day">Concluídos<button class="link" onclick="verFeitos=!verFeitos;render()">${verFeitos?"Ocultar":"Mostrar "+feitos.length}</button></div>${verFeitos?feitos.slice(0,30).map(e=>itemAgenda(e,true)).join(""):""}`:""}

function addEvento(){

function toggleEvento(id,el){

/* ---------- MÉTRICAS ---------- */
function vMetricas(){
  const M = S.metricas;
  const T = k => M.reduce((a,m)=>a+(+m[k]||0),0);

async function checarPush(){

function b64u8(b){ const p = "=".repeat((4 - b.length % 4) % 4), s = atob((b + p).replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from([...s].map(c => c.charCodeAt(0))); }

async function ativarPush(){
  if(!usuario){ toast("Entre na sua conta primeiro.",null,null,"al"); return; }
  if(ehIOS && !ehApp()){ toast("Abra o MindFirst pelo ícone da tela de início para ativar.",null,null,"al"); return; }

    let sub = await reg.pushManager.getSubscription();
    if(!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64u8(chave) });
    const j = sub.toJSON();

const SB_URL = "https://gvmcqykmtqooizsyasah.supabase.co", SB_KEY = "sb_publishable_BaDjhQCn7rYHlf45CuFu4A_bNbJ6D7c";
const sb = (window.supabase && window.supabase.createClient) ? window.supabase.createClient(SB_URL, SB_KEY, { auth:{ persistSession:true, autoRefreshToken:true, storageKey:"mf_auth", detectSessionInUrl:true } }) : null;
let usuario = null, enviando = false;
const ehSujo = () => { try{ return localStorage.getItem("mf_sujo") === "1"; }catch(e){ return false; } };
function marcarSujo(){ try{ localStorage.setItem("mf_sujo","1"); }catch(e){} clearTimeout(marcarSujo.t); marcarSujo.t = setTimeout(enviarNuvem, 600); }
async function enviarNuvem(){
  if(!sb || !usuario) return;
  if(enviando){ marcarSujo(); return; }
  enviando = true;
  S.cfg = S.cfg || {}; try{ S.cfg.tz = Intl.DateTimeFormat().resolvedOptions().timeZone || S.cfg.tz; }catch(e){}
  if(!S.cfg.nome) S.cfg.nome = C("nome");
  const { error } = await sb.from("estado").upsert({ user_id:usuario.id, dados:JSON.parse(JSON.stringify(S)), atualizado:new Date().toISOString() });
  enviando = false;
  if(!error){ try{ localStorage.removeItem("mf_sujo"); }catch(e){} dbReady = true; } else dbReady = false;
  status();
}
function normalizar(){
  ["recebimentos","gastos","eventos","metricas"].forEach(k=>{ S[k] = Array.isArray(S[k]) ? S[k] : []; });
  S.limites = S.limites || {}; S.cfg = S.cfg || {}; S.ts = S.ts || {}; S.ultimaCat = S.ultimaCat || "Alimentação";
  migrar(); somOn = C("som"); lembreteMin = C("lembrete");
}
function mesclar(r){
  ["recebimentos","gastos","eventos","metricas"].forEach(k=>{ const m = new Map(); [...(r[k]||[]), ...(S[k]||[])].forEach(x=>{ if(x && x.id) m.set(x.id,x); }); S[k] = [...m.values()]; });
  const rts = r.ts || {}, lts = S.ts || {};
  ["cfg","limites","fontes","etiquetas"].forEach(k=>{ if(r[k] !== undefined && ((rts[k]||0) > (lts[k]||0) || S[k] === undefined || (k==="cfg" && !Object.keys(S.cfg||{}).length))){ S[k] = r[k]; S.ts = S.ts || {}; if(rts[k]) S.ts[k] = rts[k]; } });
  normalizar();
}
function podeRender(){ return !sheetOpen && !alertasOpen && !document.getElementById("confirma") && !document.activeElement?.matches?.("input,select,textarea"); }
async function puxarNuvem(){
  if(!sb || !usuario) return;
  const { data, error } = await sb.from("estado").select("dados").eq("user_id", usuario.id).maybeSingle();
  if(error){ dbReady = false; status(); return; }
  if(data && data.dados && Object.keys(data.dados).length){
    if(ehSujo()){ mesclar(data.dados); await enviarNuvem(); }
    else { S = data.dados; normalizar(); }
  } else await enviarNuvem();
  LS.set("minhavida5", S); dbReady = true;
  if(podeRender()) render(); else { status(); atualizarSino(); }
}
function trocarUsuario(id){
  let ant = null; try{ ant = localStorage.getItem("mf_uid"); }catch(e){}
  if(ant && ant !== id){ S = {}; normalizar(); LS.set("minhavida5", S); try{ localStorage.removeItem("mf_sujo"); }catch(e){} }
  try{ localStorage.setItem("mf_uid", id); }catch(e){}
}

/* tela de entrada */
let modoAuth = "entrar";
function telaLogin(mostrar){ const el = document.getElementById("auth"); el.hidden = !mostrar; document.body.classList.toggle("travado", mostrar); }
function renderAuth(msg, tipo){
  const el = document.getElementById("auth"), cad = modoAuth === "criar", rec = modoAuth === "nova";
  const dica = (ehIOS && !ehApp() && !rec) ? `<p class="a-dica">Dica: para usar como app, toque em <b>Compartilhar › Adicionar à Tela de Início</b> e deixe <b>Abrir como App Web</b> ligado.</p>` : "";
  el.innerHTML = `<div class="auth-box">
    <img src="/icon-192.png?v=2" alt="MindFirst">
    <h1>${rec ? "Criar nova senha" : cad ? "Criar sua conta" : "Entrar no MindFirst"}</h1>
    <p>${rec ? "Digite a nova senha da sua conta." : cad ? "Seus dados ficam guardados na sua conta e aparecem no celular e no computador." : "Use seu e-mail e senha."}</p>
    <form onsubmit="event.preventDefault();enviarAuth()">
      ${rec ? "" : `<input id="a-email" type="email" autocomplete="email" inputmode="email" placeholder="Seu e-mail" required>`}
      <input id="a-senha" type="password" autocomplete="${cad||rec ? "new-password" : "current-password"}" placeholder="${rec ? "Nova senha (mínimo 6 caracteres)" : cad ? "Crie uma senha (mínimo 6 caracteres)" : "Senha"}" minlength="6" required>
      <button class="btn" type="submit">${rec ? "Salvar senha" : cad ? "Criar conta" : "Entrar"}</button>
    </form>
    <div id="a-msg" class="a-msg ${tipo||""}">${msg ? esc(msg) : ""}</div>
    ${rec ? "" : `<div class="a-links"><button class="link" onclick="modoAuth='${cad?"entrar":"criar"}';renderAuth()">${cad ? "Já tenho conta" : "Criar conta"}</button>${cad ? "" : `<button class="link" onclick="esqueciSenha()">Esqueci a senha</button>`}</div>`}
    ${dica}
  </div>`;
}
function msgAuth(t, c){ const m = document.getElementById("a-msg"); if(m){ m.textContent = t; m.className = "a-msg " + (c||""); } }
function traduzErro(e){
  const m = String(e && e.message || e);
  if(/Invalid login/i.test(m)) return "E-mail ou senha incorretos.";
  if(/already registered|already been registered|already exists/i.test(m)) return "Esse e-mail já tem conta. Toque em Já tenho conta.";
  if(/Password should be|at least 6/i.test(m)) return "A senha precisa ter pelo menos 6 caracteres.";
  if(/Email not confirmed/i.test(m)) return "Confirme seu e-mail pelo link que enviamos.";
  if(/rate limit|too many/i.test(m)) return "Muitas tentativas. Espere um pouco e tente de novo.";
  if(/fetch|network/i.test(m)) return "Sem internet. Verifique a conexão e tente de novo.";
  return m;
}
async function enviarAuth(){
  if(!sb){ msgAuth("Sem conexão com o servidor. Verifique a internet e recarregue.","err"); return; }
  const email = document.getElementById("a-email")?.value.trim(), senha = document.getElementById("a-senha").value;
  msgAuth("Aguarde…");
  if(modoAuth === "nova"){
    const { error } = await sb.auth.updateUser({ password:senha });
    if(error) return msgAuth(traduzErro(error),"err");
    modoAuth = "entrar"; telaLogin(false); toast("Senha alterada.",null,null,"ok"); return;
  }
  if(modoAuth === "criar"){
    const { data, error } = await sb.auth.signUp({ email, password:senha });
    if(error) return msgAuth(traduzErro(error),"err");
    if(!data.session) return msgAuth("Conta criada. Confirme pelo link que enviamos para o seu e-mail e depois entre aqui.","ok");
    return;
  }
  const { error } = await sb.auth.signInWithPassword({ email, password:senha });
  if(error) return msgAuth(traduzErro(error),"err");
}
async function esqueciSenha(){
  const email = document.getElementById("a-email")?.value.trim();
  if(!email){ msgAuth("Digite seu e-mail e toque em Esqueci a senha de novo.","err"); return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + "/" });
  msgAuth(error ? traduzErro(error) : "Enviamos um link para o seu e-mail. Abra pelo celular para criar uma nova senha.", error ? "err" : "ok");
}
async function sair(){ if(sb) await sb.auth.signOut(); }

(async()=>{
  if(location.hash === "#agenda") setTimeout(()=>go("agenda"), 50);
  if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(()=>{});
  if(!sb){ renderAuth("Não foi possível conectar. Verifique a internet e recarregue a página.","err"); telaLogin(true); return; }
  sb.auth.onAuthStateChange((ev, sess)=>{
    setTimeout(()=>{
      if(ev === "PASSWORD_RECOVERY"){ modoAuth = "nova"; renderAuth(); telaLogin(true); return; }
      if(sess && sess.user){
        const novo = !usuario || usuario.id !== sess.user.id; usuario = sess.user;
        if(novo){ trocarUsuario(usuario.id); if(modoAuth !== "nova") telaLogin(false); puxarNuvem(); checarPush().then(()=>{ if(tab==="ajustes" && podeRender()) render(); }); }
      } else if(ev === "SIGNED_OUT" || ev === "INITIAL_SESSION"){
        usuario = null; dbReady = false; modoAuth = "entrar"; renderAuth(); telaLogin(true); status();
      }
    }, 0);
  });
})();
document.addEventListener("visibilitychange", ()=>{
